    // ============================================================================
    // 화면 3: 운동 디테일 기록 (무게/횟수 증감 + 원버튼 세트 삭제)
    // ============================================================================
    function WorkoutDetailView({
      activeSession,
      currentExIndex,
      setCurrentExIndex,
      workoutLogs,
      onBack,
      handleToggleSetComplete,
      handleUpdateSetField,
      handleSetFieldDirect,
      handleDeleteSet,
      handleAddSet,
      onReorderSets,
      onToggleBodyweight,
      weightUnit,
      setWeightUnit,
      onLoadSets,
      onOpenReplace,
      onOpenAddExercise,
      onOpenExerciseInfo,
      routines,
      onSaveRoutine,
      onOverwriteRoutine,
      onReorderExercises,
      onDeleteExerciseFromSession,
      timerActive,
      timerTotal,
      timerRemaining,
      isMuted,
      setIsMuted,
      startTimer,
      stopTimer,
      addTimerSeconds
    }) {
      const currentEx = activeSession.exercises[currentExIndex];
      const touchStartXRef = useRef(null);
      const [editingField, setEditingField] = useState(null); // { setIdx, field }
      const [editingValue, setEditingValue] = useState('');
      const [isOrderModalOpen, setIsOrderModalOpen] = useState(false);
      const [isLoadSetsModalOpen, setIsLoadSetsModalOpen] = useState(false);

      // 운동을 스와이프로 전환하면 이전 운동의 입력창 편집 상태가 새 운동에 잘못 걸리지 않도록 초기화
      // (값 자체는 onChange마다 바로 저장되므로 데이터 유실 없이 편집 UI만 정리됨)
      useEffect(() => {
        setEditingField(null);
      }, [currentExIndex]);

      // 무게 단위(kg/lb) 표시·입력 변환 (저장은 항상 kg)
      const weightToDisplay = (kg) => (weightUnit === 'kg' ? kg : kgToLb(kg));
      const weightInputToKg = (val) => {
        const num = Number(val);
        if (Number.isNaN(num)) return null;
        return weightUnit === 'kg' ? num : lbToKg(num);
      };
      const adjustWeightByUnit = (setIdx, deltaInDisplayUnit) => {
        const set = currentEx.sets[setIdx];
        const currentDisplay = weightToDisplay(set.weight);
        const newDisplay = Math.max(0, currentDisplay + deltaInDisplayUnit);
        const newKg = weightUnit === 'kg' ? newDisplay : lbToKg(newDisplay);
        handleSetFieldDirect(currentExIndex, setIdx, 'weight', newKg);
      };

      // 휴식시간 직접 입력 파싱: "01:30" 형태나 순수 초 숫자("90") 모두 허용
      const parseRestInput = (val) => {
        if (val === null || val === undefined) return null;
        const trimmed = String(val).trim();
        if (trimmed.includes(':')) {
          const [m, s] = trimmed.split(':').map(Number);
          if (Number.isNaN(m) || Number.isNaN(s)) return null;
          return m * 60 + s;
        }
        const num = Number(trimmed);
        return Number.isNaN(num) ? null : num;
      };

      // 모바일 가상 키패드가 올라올 때 입력창이 가려지지 않도록 포커스 시 화면 중앙으로 스크롤
      const handleInputFocusScroll = (e) => {
        const target = e.target;
        setTimeout(() => {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 300);
      };

      // 세트 순서 드래그 앤 드롭 (길게 눌러 드래그)
      const setDragStateRef = useRef({ draggingIdx: null, longPressTimer: null });
      const dragOverSetIdxRef = useRef(null);
      const [draggingSetIdx, setDraggingSetIdx] = useState(null);
      const [dragOverSetIdx, setDragOverSetIdx] = useState(null);

      const updateDragOverSetIdx = (idx) => {
        dragOverSetIdxRef.current = idx;
        setDragOverSetIdx(idx);
      };

      const handleSetPressStart = (setIdx) => {
        if (setDragStateRef.current.longPressTimer) clearTimeout(setDragStateRef.current.longPressTimer);
        setDragStateRef.current.longPressTimer = setTimeout(() => {
          setDragStateRef.current.draggingIdx = setIdx;
          setDraggingSetIdx(setIdx);
          if (navigator.vibrate) navigator.vibrate(30);
        }, 350);
      };

      const handleSetTouchMove = (e) => {
        if (setDragStateRef.current.draggingIdx === null) {
          if (setDragStateRef.current.longPressTimer) clearTimeout(setDragStateRef.current.longPressTimer);
          return;
        }
        e.preventDefault();
        const touch = e.touches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        const rowEl = el && el.closest && el.closest('[data-set-idx]');
        if (rowEl) {
          const overIdx = Number(rowEl.getAttribute('data-set-idx'));
          if (!Number.isNaN(overIdx)) updateDragOverSetIdx(overIdx);
        }
      };

      // 데스크톱 마우스로 테스트할 때도 동일하게 동작하도록 마우스 이동 추적 추가
      const handleSetMouseMove = (e) => {
        if (setDragStateRef.current.draggingIdx === null) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const rowEl = el && el.closest && el.closest('[data-set-idx]');
        if (rowEl) {
          const overIdx = Number(rowEl.getAttribute('data-set-idx'));
          if (!Number.isNaN(overIdx)) updateDragOverSetIdx(overIdx);
        }
      };

      const handleSetPressEnd = () => {
        if (setDragStateRef.current.longPressTimer) clearTimeout(setDragStateRef.current.longPressTimer);
        const fromIdx = setDragStateRef.current.draggingIdx;
        const toIdx = dragOverSetIdxRef.current;
        if (fromIdx !== null && toIdx !== null && toIdx !== fromIdx) {
          const newSets = [...currentEx.sets];
          const [moved] = newSets.splice(fromIdx, 1);
          newSets.splice(toIdx, 0, moved);
          onReorderSets(currentExIndex, newSets);
        }
        setDragStateRef.current.draggingIdx = null;
        dragOverSetIdxRef.current = null;
        setDraggingSetIdx(null);
        setDragOverSetIdx(null);
      };

      // 마우스로 테스트할 때, 목록 바깥 등 어디서 버튼을 놓아도 드래그가 확실히 종료되도록 전역 리스너 등록
      useEffect(() => {
        if (draggingSetIdx === null) return;
        window.addEventListener('mouseup', handleSetPressEnd);
        return () => window.removeEventListener('mouseup', handleSetPressEnd);
      }, [draggingSetIdx]);

      // 운동 화면 표시 중에는 화면이 꺼지지 않도록 Wake Lock 유지
      useEffect(() => {
        let wakeLock = null;

        const requestWakeLock = async () => {
          try {
            if ('wakeLock' in navigator) {
              wakeLock = await navigator.wakeLock.request('screen');
            }
          } catch (e) {
            console.error('화면 유지(Wake Lock) 요청 실패:', e);
          }
        };
        requestWakeLock();

        // 앱이 백그라운드로 갔다가 다시 돌아오면 Wake Lock이 자동 해제되므로 재요청
        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible') requestWakeLock();
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (wakeLock) wakeLock.release().catch(() => {});
        };
      }, []);

      // 오늘 운동 조합 전체를 하나의 루틴으로 저장 (신규 저장 또는 기존 루틴 덮어쓰기)
      const [isSaveRoutineModalOpen, setIsSaveRoutineModalOpen] = useState(false);

      const handleTouchStart = (e) => {
        touchStartXRef.current = e.touches[0].clientX;
      };

      const handleTouchEnd = (e) => {
        if (touchStartXRef.current === null) return;
        const diffX = touchStartXRef.current - e.changedTouches[0].clientX;

        if (Math.abs(diffX) > 50) {
          if (diffX > 0 && currentExIndex < activeSession.exercises.length - 1) {
            setCurrentExIndex(prev => prev + 1);
          } else if (diffX < 0 && currentExIndex > 0) {
            setCurrentExIndex(prev => prev - 1);
          }
        }
        touchStartXRef.current = null;
      };

      const totalVolume = useMemo(() => {
        if (!currentEx) return 0;
        return currentEx.sets.reduce((sum, s) => sum + (s.completed ? s.weight * s.reps : 0), 0);
      }, [currentEx]);

      // 맨몸 운동용: 총 횟수 / 최대 횟수(한 세트 기준)
      const totalReps = useMemo(() => {
        if (!currentEx) return 0;
        return currentEx.sets.reduce((sum, s) => sum + (s.completed ? s.reps : 0), 0);
      }, [currentEx]);

      const maxSetReps = useMemo(() => {
        if (!currentEx) return 0;
        const completedSets = currentEx.sets.filter(s => s.completed && s.reps > 0);
        if (completedSets.length === 0) return 0;
        return Math.max(...completedSets.map(s => s.reps));
      }, [currentEx]);

      // 최대 무게 세트 (완료된 세트 중 가장 무거운 무게)
      const bestSet = useMemo(() => {
        if (!currentEx) return { weight: 0, reps: 0 };
        const completedSets = currentEx.sets.filter(s => s.completed && s.weight > 0);
        if (completedSets.length === 0) return { weight: 0, reps: 0 };
        return completedSets.reduce((best, s) => (s.weight > best.weight ? s : best), completedSets[0]);
      }, [currentEx]);

      // 추정 1RM (Epley 공식: weight * (1 + reps/30), 완료된 세트 중 최대값)
      const estimated1RM = useMemo(() => {
        if (!currentEx) return 0;
        const completedSets = currentEx.sets.filter(s => s.completed && s.weight > 0 && s.reps > 0);
        if (completedSets.length === 0) return 0;
        const best = completedSets.reduce((acc, s) => {
          const oneRM = s.weight * (1 + s.reps / 30);
          return oneRM > acc ? oneRM : acc;
        }, 0);
        return Math.round(best * 10) / 10;
      }, [currentEx]);

      // 이전 기록(가장 최근 다른 날짜) / 전체 최고 기록 - 최대무게·1RM·총볼륨 각각 계산
      const exerciseHistoryStats = useMemo(() => {
        const empty = {
          prev: { weight: 0, reps: 0, oneRM: 0, volume: 0, maxReps: 0, totalReps: 0 },
          best: { weight: 0, reps: 0, oneRM: 0, volume: 0, maxReps: 0, totalReps: 0 }
        };
        if (!currentEx || !workoutLogs) return empty;
        const isBW = currentEx.isBodyweight;

        const rows = [];
        Object.keys(workoutLogs).sort((a, b) => b.localeCompare(a)).forEach(date => {
          const log = workoutLogs[date];
          if (!log.exercises) return;
          const match = log.exercises.find(e => e.id === currentEx.id);
          if (!match) return;
          const completedSets = (match.sets || []).filter(s => s.completed && (isBW ? s.reps > 0 : s.weight > 0));
          if (completedSets.length === 0) return;

          if (isBW) {
            const maxRepsOfDay = Math.max(...completedSets.map(s => s.reps));
            const totalRepsOfDay = completedSets.reduce((sum, s) => sum + s.reps, 0);
            rows.push({ date, weight: 0, reps: maxRepsOfDay, oneRM: 0, volume: 0, maxReps: maxRepsOfDay, totalReps: totalRepsOfDay });
          } else {
            const bestOfDay = completedSets.reduce((b, s) => (s.weight > b.weight ? s : b), completedSets[0]);
            const oneRMOfDay = completedSets.reduce((acc, s) => Math.max(acc, s.weight * (1 + s.reps / 30)), 0);
            const volumeOfDay = completedSets.reduce((sum, s) => sum + s.weight * s.reps, 0);
            rows.push({
              date,
              weight: bestOfDay.weight,
              reps: bestOfDay.reps,
              oneRM: Math.round(oneRMOfDay * 10) / 10,
              volume: volumeOfDay,
              maxReps: 0,
              totalReps: 0
            });
          }
        });

        if (rows.length === 0) return empty;

        // 이전: 오늘(현재 세션 날짜)보다 이전인 가장 최근 기록
        const prevRow = rows.find(r => r.date < activeSession.date) || empty.prev;

        // 최고: 전체 기록 중 항목별 최댓값 (날짜 달라도 무방)
        const best = rows.reduce((acc, r) => ({
          weight: r.weight > acc.weight ? r.weight : acc.weight,
          reps: r.weight > acc.weight ? r.reps : acc.reps,
          oneRM: Math.max(acc.oneRM, r.oneRM),
          volume: Math.max(acc.volume, r.volume),
          maxReps: Math.max(acc.maxReps, r.maxReps),
          totalReps: Math.max(acc.totalReps, r.totalReps)
        }), { weight: 0, reps: 0, oneRM: 0, volume: 0, maxReps: 0, totalReps: 0 });

        return { prev: prevRow, best };
      }, [currentEx, workoutLogs, activeSession.date]);

      // 이전 대비 증감 화살표 (상승: 빨강 ↗, 하락: 파랑 ↘)
      const renderTrend = (current, prev) => {
        if (!prev || prev <= 0 || !current || current <= 0) return null;
        if (current > prev) return <span className="text-rose-400 ml-0.5">↗</span>;
        if (current < prev) return <span className="text-blue-400 ml-0.5">↘</span>;
        return null;
      };

      // 현재 값이 전체 최고 기록과 같거나 넘어서면 표시되는 기록 점
      const renderBestDot = (current, best) => {
        if (!best || best <= 0 || !current || current <= 0) return null;
        if (current >= best) return <span className="text-rose-400 ml-0.5">●</span>;
        return null;
      };

      const timerProgress = useMemo(() => {
        if (!timerActive || timerTotal <= 0) return 0;
        return ((timerTotal - timerRemaining) / timerTotal) * 100;
      }, [timerActive, timerTotal, timerRemaining]);

      const formatTime = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      if (!currentEx) return null;

      return (
        <div className="flex flex-col h-full bg-[#121212] relative overflow-hidden">
          {/* 상단 헤더 */}
          <div className="p-3 bg-[#1E1E1E] border-b border-gray-800 flex items-center justify-between flex-shrink-0">
            <button onClick={onBack} className="p-1 text-gray-400 hover:text-white">
              <Icon name="chevron-left" className="w-6 h-6" />
            </button>
            <span className="text-sm font-bold text-gray-200">{activeSession.date} 운동 기록</span>
            <div className="flex items-center space-x-3">
              <button onClick={() => setIsSaveRoutineModalOpen(true)} className="text-xs font-bold text-gray-200 bg-[#282828] px-2 py-1 rounded-md hover:bg-[#333333]">
                루틴저장
              </button>
              <button onClick={onBack} className="p-1 text-blue-400 font-bold text-sm">완료</button>
            </div>
          </div>

          {/* 인디케이터 */}
          <div className="flex justify-center items-center space-x-2 py-2 bg-[#1A1A1A] border-b border-gray-800 flex-shrink-0">
            {activeSession.exercises.map((ex, idx) => {
              const allCompleted = ex.sets.every(s => s.completed);
              return (
                <button
                  key={idx}
                  onClick={() => setCurrentExIndex(idx)}
                  className={`w-3 h-3 rounded-full transition-all flex items-center justify-center ${
                    currentExIndex === idx 
                      ? 'bg-blue-500 ring-2 ring-blue-300 w-4 h-4' 
                      : allCompleted ? 'bg-green-500' : 'bg-gray-700'
                  }`}
                />
              );
            })}
          </div>

          {/* 메인 세트 영역 */}
          <div 
            onTouchStart={handleTouchStart}
            onTouchEnd={handleTouchEnd}
            className="flex-1 overflow-y-auto p-4 space-y-4 pb-56"
          >
            <div className="flex justify-between items-center text-[11px] text-gray-500 border-b border-gray-800/60 pb-1">
              <span>👈 좌우 스와이프로 운동 전환</span>
              <button onClick={() => setIsOrderModalOpen(true)} className="flex items-center space-x-1 text-gray-300 hover:text-blue-400">
                <span>{currentExIndex + 1} / {activeSession.exercises.length}</span>
                <Icon name="list" className="w-3.5 h-3.5" />
              </button>
            </div>

            <div>
              <div className="flex justify-between items-start">
                <div className="flex items-center space-x-1.5">
                  <h2 className="text-xl font-extrabold text-white">{currentEx.name}</h2>
                  <button onClick={() => onOpenExerciseInfo(currentEx)} className="text-gray-400 hover:text-blue-400">
                    <Icon name="info" className="w-4 h-4" />
                  </button>
                </div>
                <div className="flex items-center space-x-3 flex-shrink-0">
                  <button onClick={onOpenAddExercise} className="text-xs text-blue-400 font-bold hover:underline">운동추가</button>
                  <button onClick={onOpenReplace} className="text-xs text-blue-400 font-bold hover:underline">교체</button>
                </div>
              </div>

              <button
                onClick={() => onToggleBodyweight(currentExIndex)}
                className="mt-2 inline-flex items-center bg-[#1E1E1E] border border-gray-700 rounded-lg overflow-hidden text-[10px] font-bold"
              >
                <span className={`px-2.5 py-1 ${!currentEx.isBodyweight ? 'bg-blue-600 text-white' : 'text-gray-400'}`}>무게 운동</span>
                <span className={`px-2.5 py-1 ${currentEx.isBodyweight ? 'bg-blue-600 text-white' : 'text-gray-400'}`}>맨몸 운동(횟수)</span>
              </button>

              <div className="grid grid-cols-3 gap-2 mt-3 bg-[#1E1E1E] p-3 rounded-xl border border-gray-800">
                {currentEx.isBodyweight ? (
                  <>
                    <div>
                      <div className="text-[10px] text-gray-400">최대 횟수</div>
                      <div className="text-sm font-bold text-gray-100">{maxSetReps > 0 ? `${maxSetReps}회` : '-'}</div>
                      {exerciseHistoryStats.prev.maxReps > 0 && (
                        <div className="text-[9px] text-gray-500 mt-0.5">
                          이전 {exerciseHistoryStats.prev.maxReps}회
                          {renderTrend(maxSetReps, exerciseHistoryStats.prev.maxReps)}
                        </div>
                      )}
                      {exerciseHistoryStats.best.maxReps > 0 && (
                        <div className="text-[9px] text-gray-500">
                          최고 {exerciseHistoryStats.best.maxReps}회
                          {renderBestDot(maxSetReps, exerciseHistoryStats.best.maxReps)}
                        </div>
                      )}
                    </div>
                    <div>
                      <div className="text-[10px] text-gray-400">완료 세트</div>
                      <div className="text-sm font-bold text-blue-400">
                        {currentEx.sets.filter(s => s.completed).length} / {currentEx.sets.length}
                      </div>
                    </div>
                    <div>
                      <div className="text-[10px] text-gray-400">총 횟수</div>
                      <div className="text-sm font-bold text-gray-100">{totalReps}회</div>
                      {exerciseHistoryStats.prev.totalReps > 0 && (
                        <div className="text-[9px] text-gray-500 mt-0.5">
                          이전 {exerciseHistoryStats.prev.totalReps}회
                          {renderTrend(totalReps, exerciseHistoryStats.prev.totalReps)}
                        </div>
                      )}
                      {exerciseHistoryStats.best.totalReps > 0 && (
                        <div className="text-[9px] text-gray-500">
                          최고 {exerciseHistoryStats.best.totalReps}회
                          {renderBestDot(totalReps, exerciseHistoryStats.best.totalReps)}
                        </div>
                      )}
                    </div>
                  </>
                ) : (
                  <>
                    <div>
                      <div className="text-[10px] text-gray-400">최대 무게</div>
                      <div className="text-sm font-bold text-gray-100">
                        {bestSet.weight > 0 ? `${bestSet.weight} x ${bestSet.reps}` : '-'}
                      </div>
                      {exerciseHistoryStats.prev.weight > 0 && (
                        <div className="text-[9px] text-gray-500 mt-0.5">
                          이전 {exerciseHistoryStats.prev.weight} x {exerciseHistoryStats.prev.reps}
                          {renderTrend(bestSet.weight, exerciseHistoryStats.prev.weight)}
                        </div>
                      )}
                      {exerciseHistoryStats.best.weight > 0 && (
                        <div className="text-[9px] text-gray-500">
                          최고 {exerciseHistoryStats.best.weight} x {exerciseHistoryStats.best.reps}
                          {renderBestDot(bestSet.weight, exerciseHistoryStats.best.weight)}
                        </div>
                      )}
                    </div>
                    <div>
                      <div className="text-[10px] text-gray-400">추정 1RM</div>
                      <div className="text-sm font-bold text-blue-400">{estimated1RM > 0 ? `${estimated1RM} kg` : '-'}</div>
                      {exerciseHistoryStats.prev.oneRM > 0 && (
                        <div className="text-[9px] text-gray-500 mt-0.5">
                          이전 {exerciseHistoryStats.prev.oneRM}kg
                          {renderTrend(estimated1RM, exerciseHistoryStats.prev.oneRM)}
                        </div>
                      )}
                      {exerciseHistoryStats.best.oneRM > 0 && (
                        <div className="text-[9px] text-gray-500">
                          최고 {exerciseHistoryStats.best.oneRM}kg
                          {renderBestDot(estimated1RM, exerciseHistoryStats.best.oneRM)}
                        </div>
                      )}
                    </div>
                    <div>
                      <div className="text-[10px] text-gray-400">총 볼륨</div>
                      <div className="text-sm font-bold text-gray-100">{totalVolume} kg</div>
                      {exerciseHistoryStats.prev.volume > 0 && (
                        <div className="text-[9px] text-gray-500 mt-0.5">
                          이전 {exerciseHistoryStats.prev.volume}kg
                          {renderTrend(totalVolume, exerciseHistoryStats.prev.volume)}
                        </div>
                      )}
                      {exerciseHistoryStats.best.volume > 0 && (
                        <div className="text-[9px] text-gray-500">
                          최고 {exerciseHistoryStats.best.volume}kg
                          {renderBestDot(totalVolume, exerciseHistoryStats.best.volume)}
                        </div>
                      )}
                    </div>
                  </>
                )}
              </div>
            </div>

            {/* 세트 리스트 (+5 / -5, +1 / -1, 세트 원버튼 삭제, 길게 눌러 드래그로 순서 변경) */}
            <div className="flex items-center justify-between px-0.5">
              <span className="text-[10px] text-gray-500">👆 세트를 길게 눌러 드래그하면 순서를 바꿀 수 있어요</span>
              {!currentEx.isBodyweight && (
                <div className="flex items-center bg-[#1E1E1E] border border-gray-700 rounded-lg overflow-hidden flex-shrink-0 ml-2">
                  <button
                    onClick={() => setWeightUnit('kg')}
                    className={`px-2 py-1 text-[10px] font-bold ${weightUnit === 'kg' ? 'bg-blue-600 text-white' : 'text-gray-400'}`}
                  >
                    kg
                  </button>
                  <button
                    onClick={() => setWeightUnit('lb')}
                    className={`px-2 py-1 text-[10px] font-bold ${weightUnit === 'lb' ? 'bg-blue-600 text-white' : 'text-gray-400'}`}
                  >
                    lb
                  </button>
                </div>
              )}
            </div>
            <div className="space-y-2">
              {currentEx.sets.map((set, setIdx) => (
                <div 
                  key={set.setNum}
                  data-set-idx={setIdx}
                  onTouchStart={() => handleSetPressStart(setIdx)}
                  onTouchMove={handleSetTouchMove}
                  onTouchEnd={handleSetPressEnd}
                  onMouseDown={() => handleSetPressStart(setIdx)}
                  onMouseMove={handleSetMouseMove}
                  onMouseUp={handleSetPressEnd}
                  className={`p-2.5 rounded-xl border flex items-center justify-between transition-all ${
                    set.completed ? 'bg-[#18261E] border-green-800/60' : 'bg-[#1E1E1E] border-gray-800'
                  } ${draggingSetIdx === setIdx ? 'opacity-40 scale-[0.98]' : ''} ${
                    dragOverSetIdx === setIdx && draggingSetIdx !== null && draggingSetIdx !== setIdx
                      ? 'ring-2 ring-blue-400' : ''
                  }`}
                >
                  <div className="flex items-center space-x-2">
                    <Icon name="grip-vertical" className="w-3.5 h-3.5 text-gray-600 flex-shrink-0" />
                    <button 
                      onClick={() => handleToggleSetComplete(currentExIndex, setIdx)}
                      className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs transition-colors ${
                        set.completed ? 'bg-green-500 text-black' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'
                      }`}
                    >
                      {set.completed ? '✓' : set.setNum}
                    </button>
                    <div className="text-[10px] text-gray-400">
                      휴식<br/>
                      {editingField && editingField.setIdx === setIdx && editingField.field === 'rest' ? (
                        <input
                          type="text"
                          inputMode="numeric"
                          autoFocus
                          value={editingValue}
                          onChange={(e) => {
                            const val = e.target.value;
                            setEditingValue(val);
                            const secs = parseRestInput(val);
                            if (secs !== null) handleSetFieldDirect(currentExIndex, setIdx, 'restSeconds', secs);
                          }}
                          onFocus={handleInputFocusScroll}
                          onBlur={() => setEditingField(null)}
                          onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
                          className="w-14 bg-[#121212] border border-blue-500 rounded text-center text-xs font-bold text-white font-mono py-0.5"
                        />
                      ) : (
                        <span
                          onClick={() => { setEditingField({ setIdx, field: 'rest' }); setEditingValue(formatTime(set.restSeconds)); }}
                          className="font-mono text-gray-200 cursor-pointer border-b border-dashed border-gray-600"
                        >
                          {formatTime(set.restSeconds)}
                        </span>
                      )}
                    </div>
                  </div>

                  {/* 수치 표시 영역 (터치하여 직접 입력 가능, 입력은 kg/lb 단위 전환 가능 · 평상시 표시는 항상 kg) */}
                  <div className="flex items-center space-x-2">
                    {!currentEx.isBodyweight && (
                      <div className="text-center min-w-[42px]">
                        {editingField && editingField.setIdx === setIdx && editingField.field === 'weight' ? (
                          <input
                            type="number"
                            autoFocus
                            value={editingValue}
                            onChange={(e) => {
                              const val = e.target.value;
                              setEditingValue(val);
                              const kgValue = weightInputToKg(val);
                              if (kgValue !== null) handleSetFieldDirect(currentExIndex, setIdx, 'weight', kgValue);
                            }}
                            onFocus={handleInputFocusScroll}
                            onBlur={() => setEditingField(null)}
                            onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
                            className="w-12 bg-[#121212] border border-blue-500 rounded text-center text-sm font-bold text-white font-mono py-0.5"
                          />
                        ) : (
                          <span
                            onClick={() => { setEditingField({ setIdx, field: 'weight' }); setEditingValue(String(weightToDisplay(set.weight))); }}
                            className="text-sm font-bold text-white font-mono cursor-pointer border-b border-dashed border-gray-600"
                          >
                            {set.weight}
                          </span>
                        )}
                        <span className="text-[10px] text-gray-400 ml-0.5">
                          {editingField && editingField.setIdx === setIdx && editingField.field === 'weight' ? weightUnit : 'kg'}
                        </span>
                      </div>
                    )}
                    <div className="text-center min-w-[32px]">
                      {editingField && editingField.setIdx === setIdx && editingField.field === 'reps' ? (
                        <input
                          type="number"
                          autoFocus
                          value={editingValue}
                          onChange={(e) => {
                            const val = e.target.value;
                            setEditingValue(val);
                            handleSetFieldDirect(currentExIndex, setIdx, 'reps', val);
                          }}
                          onFocus={handleInputFocusScroll}
                          onBlur={() => setEditingField(null)}
                          onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); }}
                          className="w-10 bg-[#121212] border border-blue-500 rounded text-center text-sm font-bold text-white font-mono py-0.5"
                        />
                      ) : (
                        <span
                          onClick={() => { setEditingField({ setIdx, field: 'reps' }); setEditingValue(String(set.reps)); }}
                          className={`font-bold text-white font-mono cursor-pointer border-b border-dashed border-gray-600 ${currentEx.isBodyweight ? 'text-lg' : 'text-sm'}`}
                        >
                          {set.reps}
                        </span>
                      )}
                      <span className="text-[10px] text-gray-400 ml-0.5">회</span>
                    </div>
                  </div>

                  {/* 미세 조절 버튼군 (-5, +5, -1, +1, 삭제) */}
                  <div className="flex items-center space-x-1">
                    {/* 무게 -5 / +5 (현재 선택된 kg/lb 단위 기준으로 증감, 맨몸 운동에서는 숨김) */}
                    {!currentEx.isBodyweight && (
                      <div className="flex flex-col space-y-0.5">
                        <button 
                          onClick={() => adjustWeightByUnit(setIdx, 5)}
                          className="px-1.5 py-0.5 bg-gray-800 text-[9px] text-blue-400 font-bold rounded hover:bg-gray-700 active:scale-95"
                        >
                          +5
                        </button>
                        <button 
                          onClick={() => adjustWeightByUnit(setIdx, -5)}
                          className="px-1.5 py-0.5 bg-gray-800 text-[9px] text-red-400 font-bold rounded hover:bg-gray-700 active:scale-95"
                        >
                          -5
                        </button>
                      </div>
                    )}

                    {/* 횟수 -1 / +1 */}
                    <div className="flex flex-col space-y-0.5">
                      <button 
                        onClick={() => handleUpdateSetField(currentExIndex, setIdx, 'reps', 1)}
                        className="px-1.5 py-0.5 bg-gray-800 text-[9px] text-blue-400 font-bold rounded hover:bg-gray-700 active:scale-95"
                      >
                        +1
                      </button>
                      <button 
                        onClick={() => handleUpdateSetField(currentExIndex, setIdx, 'reps', -1)}
                        className="px-1.5 py-0.5 bg-gray-800 text-[9px] text-red-400 font-bold rounded hover:bg-gray-700 active:scale-95"
                      >
                        -1
                      </button>
                    </div>

                    {/* 원버튼 삭제 (휴지통) - 완료된 세트만 삭제 전 확인 팝업, 미완료 세트는 바로 삭제 */}
                    <button 
                      onClick={async () => {
                        if (set.completed) {
                          if (await window.appConfirm(`${set.setNum}세트를 삭제할까요?`)) {
                            handleDeleteSet(currentExIndex, setIdx);
                          }
                        } else {
                          handleDeleteSet(currentExIndex, setIdx);
                        }
                      }}
                      className="p-1.5 text-gray-500 hover:text-red-400 active:scale-90 transition-transform ml-1"
                      title="세트 삭제"
                    >
                      <Icon name="trash-2" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              ))}
            </div>

            <div className="flex space-x-2">
              <button
                onClick={() => setIsLoadSetsModalOpen(true)}
                className="flex-1 py-2.5 border border-dashed border-gray-700 hover:border-blue-500 text-gray-400 hover:text-blue-400 rounded-xl text-xs font-bold flex items-center justify-center space-x-1 transition-colors"
              >
                <Icon name="history" className="w-4 h-4" />
                <span>세트 호출</span>
              </button>
              <button
                onClick={() => handleAddSet(currentExIndex)}
                className="flex-1 py-2.5 border border-dashed border-gray-700 hover:border-blue-500 text-gray-400 hover:text-blue-400 rounded-xl text-xs font-bold flex items-center justify-center space-x-1 transition-colors"
              >
                <Icon name="plus" className="w-4 h-4" />
                <span>세트 추가</span>
              </button>
            </div>
          </div>

          {/* 하단 타이머 바 - 휴식 타이머 영역 전체를 채우는 진행률 애니메이션 */}
          <div className="absolute bottom-0 left-0 right-0 bg-[#1E1E1E] border-t border-gray-800 bottom-bar-safe shadow-2xl z-20 relative overflow-hidden">
            {/* 진행률에 따라 영역 전체를 왼쪽에서 오른쪽으로 채우는 배경 애니메이션 */}
            <div
              className={`absolute inset-y-0 left-0 transition-all duration-300 ease-linear ${
                timerProgress >= 90 ? 'bg-red-500/30' : timerProgress >= 70 ? 'bg-amber-500/25' : 'bg-blue-600/25'
              }`}
              style={{ width: `${timerProgress}%` }}
            />

            <div className="relative z-10 px-3 py-1.5 flex items-center min-h-[52px]">
            <div className="flex items-center justify-between w-full">
              <div className="flex items-center space-x-2">
                <Icon name="clock" className={`w-4 h-4 flex-shrink-0 ${timerActive ? 'text-blue-400 animate-pulse' : 'text-gray-500'}`} />
                <div className="flex flex-col justify-center">
                  <div className="text-[9px] text-gray-400 leading-tight">휴식 타이머</div>
                  <div className="text-base font-bold font-mono text-white leading-tight">
                    {formatTime(timerRemaining)} <span className="text-[10px] text-gray-500">/ {formatTime(timerTotal)}</span>
                  </div>
                </div>
              </div>

              <div className="flex items-center space-x-1">
                <button 
                  onClick={() => setIsMuted(!isMuted)}
                  className="p-1.5 bg-gray-800 hover:bg-gray-700 rounded-lg text-gray-300"
                >
                  <Icon name={isMuted ? "volume-x" : "volume-2"} className={`w-3.5 h-3.5 ${isMuted ? 'text-red-400' : 'text-blue-400'}`} />
                </button>

                {/* 진동 테스트 버튼 - 항상 결과를 알림으로 보여줘서 정확한 원인 진단 */}
                <button
                  onClick={async () => {
                    const supported = !!navigator.vibrate;
                    let result = null;
                    if (supported) {
                      result = navigator.vibrate([300, 150, 300]);
                    }
                    const resultText = !supported ? '지원 안 함' : (result ? '성공(API는 정상 호출됨)' : '거부됨');
                    await window.appAlert(
                      `[진동 진단 결과]\n` +
                      `API 지원 여부: ${supported ? '예' : '아니오'}\n` +
                      `호출 결과: ${resultText}\n` +
                      `기기정보: ${navigator.userAgent}\n\n` +
                      `※ '성공'인데도 실제 진동이 안 느껴진다면, 브라우저는 요청을 받아들였지만 기기(OS)가 실제 진동을 막고 있는 경우입니다. 무음모드/진동 설정을 확인해주세요.`
                    );
                  }}
                  className="p-1.5 bg-gray-800 hover:bg-gray-700 rounded-lg text-gray-300"
                  title="진동 테스트"
                >
                  <Icon name="zap" className="w-3.5 h-3.5 text-yellow-400" />
                </button>

                <button 
                  onClick={() => addTimerSeconds(-30)}
                  className="px-2 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-bold text-red-400 rounded-lg active:scale-95 transition-transform"
                >
                  -30s
                </button>

                <button 
                  onClick={() => addTimerSeconds(30)}
                  className="px-2 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-bold text-blue-400 rounded-lg active:scale-95 transition-transform"
                >
                  +30s
                </button>

                {/* '정지' 명칭으로 고정 및 크기 유지 */}
                <button 
                  onClick={() => {
                    if (timerActive) {
                      stopTimer();
                      return;
                    }
                    // 시작 버튼 → 다음 미완료 세트를 완료 처리하며 휴식 타이머 시작 (진행 흐름 인식)
                    const nextIdx = currentEx.sets.findIndex(s => !s.completed);
                    if (nextIdx !== -1) {
                      handleToggleSetComplete(currentExIndex, nextIdx);
                    } else {
                      startTimer(60);
                    }
                  }}
                  className="w-14 h-8 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-lg flex items-center justify-center space-x-1 shadow-md active:scale-95 transition-transform"
                >
                  <Icon name={timerActive ? "pause" : "play"} className="w-3.5 h-3.5" />
                  <span>{timerActive ? '정지' : '시작'}</span>
                </button>
              </div>
            </div>
            </div>
          </div>

          {/* 운동 순서 조정 모달 (별도 목록 화면에서 롱탭 드래그 또는 화살표로 순서 변경) */}
          {isOrderModalOpen && (
            <ExerciseOrderModal
              exercises={activeSession.exercises}
              onClose={() => setIsOrderModalOpen(false)}
              onSelectExercise={(idx) => { setCurrentExIndex(idx); setIsOrderModalOpen(false); }}
              onReorder={(newOrder) => { onReorderExercises(newOrder); }}
              onDeleteExercise={(exerciseId) => onDeleteExerciseFromSession(exerciseId)}
            />
          )}

          {/* 세트 호출 모달 (이전에 이 운동을 했던 다른 날짜의 세트 구성 불러오기) */}
          {isLoadSetsModalOpen && (
            <LoadSetsModal
              exercise={currentEx}
              workoutLogs={workoutLogs}
              currentDate={activeSession.date}
              onClose={() => setIsLoadSetsModalOpen(false)}
              onLoad={(historySets) => {
                onLoadSets(currentExIndex, historySets);
                setIsLoadSetsModalOpen(false);
              }}
            />
          )}

          {/* 루틴 저장 모달 (신규 저장 또는 기존 루틴 덮어쓰기) */}
          {isSaveRoutineModalOpen && (
            <SaveRoutineModal
              routines={routines}
              exercises={activeSession.exercises}
              onClose={() => setIsSaveRoutineModalOpen(false)}
              onSaveNew={(name, exercises) => { onSaveRoutine(name, exercises); setIsSaveRoutineModalOpen(false); }}
              onOverwrite={(routineId, exercises) => { onOverwriteRoutine(routineId, exercises); setIsSaveRoutineModalOpen(false); }}
            />
          )}
        </div>
      );
    }

    // ============================================================================
    // 운동 순서 조정 화면 (운동별 목록을 롱탭+드래그 또는 화살표 버튼으로 순서 변경)
    // ============================================================================
    function ExerciseOrderModal({ exercises, onClose, onSelectExercise, onReorder, onDeleteExercise }) {
      const [order, setOrder] = useState(exercises);
      const [draggingIdx, setDraggingIdx] = useState(null);
      const [dragOverIdx, setDragOverIdx] = useState(null);
      const rowRefs = useRef([]);
      const longPressTimerRef = useRef(null);
      const activeDragIdxRef = useRef(null);

      // 부모의 운동 목록이 바뀌면(삭제 등) 로컬 순서도 동기화
      useEffect(() => { setOrder(exercises); }, [exercises]);

      const commitOrder = (newOrder) => {
        setOrder(newOrder);
        onReorder(newOrder);
      };

      const handleDeleteClick = async (id) => {
        if (order.length <= 1) {
          window.appAlert('최소 1개 이상의 운동이 유지되어야 합니다.');
          return;
        }
        if (!(await window.appConfirm('이 운동을 목록에서 삭제할까요?'))) return;
        setOrder(order.filter(e => e.id !== id));
        onDeleteExercise(id);
      };

      const moveItem = (fromIdx, toIdx) => {
        if (toIdx < 0 || toIdx >= order.length || fromIdx === toIdx) return;
        const next = [...order];
        const [moved] = next.splice(fromIdx, 1);
        next.splice(toIdx, 0, moved);
        commitOrder(next);
      };

      // 롱탭으로 드래그 모드 진입 (터치)
      const handleTouchStart = (idx) => {
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);
        longPressTimerRef.current = setTimeout(() => {
          activeDragIdxRef.current = idx;
          setDraggingIdx(idx);
          if (navigator.vibrate) navigator.vibrate(40);
        }, 350);
      };

      const handleTouchMove = (e) => {
        if (activeDragIdxRef.current === null) return;
        const touch = e.touches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        const rowEl = el && el.closest && el.closest('[data-order-idx]');
        if (rowEl) {
          const overIdx = Number(rowEl.getAttribute('data-order-idx'));
          if (!Number.isNaN(overIdx)) setDragOverIdx(overIdx);
        }
      };

      const handleTouchEnd = () => {
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);
        if (activeDragIdxRef.current !== null && dragOverIdx !== null && dragOverIdx !== activeDragIdxRef.current) {
          moveItem(activeDragIdxRef.current, dragOverIdx);
        }
        activeDragIdxRef.current = null;
        setDraggingIdx(null);
        setDragOverIdx(null);
      };

      const handleTouchCancel = () => {
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);
        activeDragIdxRef.current = null;
        setDraggingIdx(null);
        setDragOverIdx(null);
      };

      return (
        <div className="fixed inset-0 bg-[#121212] z-50 flex flex-col">
          <div className="p-3 bg-[#1E1E1E] border-b border-gray-800 flex items-center justify-between flex-shrink-0">
            <button onClick={onClose} className="p-1 text-gray-400 hover:text-white">
              <Icon name="chevron-left" className="w-6 h-6" />
            </button>
            <span className="text-sm font-bold text-gray-200">운동 순서 조정</span>
            <button onClick={onClose} className="p-1 text-blue-400 font-bold text-sm">완료</button>
          </div>

          <div className="px-4 pt-3 pb-1 text-[11px] text-gray-500 flex-shrink-0">
            👆 항목을 길게 눌러 드래그하거나, 화살표 버튼으로 순서를 바꿔보세요.
          </div>

          <div className="flex-1 overflow-y-auto p-3 space-y-2">
            {order.map((ex, idx) => (
              <div
                key={ex.id}
                data-order-idx={idx}
                ref={(el) => { rowRefs.current[idx] = el; }}
                onTouchStart={() => handleTouchStart(idx)}
                onTouchMove={handleTouchMove}
                onTouchEnd={handleTouchEnd}
                onTouchCancel={handleTouchCancel}
                className={`flex items-center justify-between rounded-xl border p-3 transition-all ${
                  draggingIdx === idx
                    ? 'bg-[#1E293B] border-blue-500 scale-[1.02] shadow-lg'
                    : dragOverIdx === idx && draggingIdx !== null
                    ? 'bg-[#242424] border-blue-700/60'
                    : 'bg-[#1E1E1E] border-gray-800/80'
                }`}
              >
                <div className="flex items-center space-x-3 flex-1 min-w-0" onClick={() => onSelectExercise(idx)}>
                  <Icon name="grip-vertical" className="w-4 h-4 text-gray-500 flex-shrink-0" />
                  <span className="text-xs font-mono text-blue-400 font-bold flex-shrink-0">{idx + 1}</span>
                  <span className="text-sm font-semibold text-gray-100 truncate">{ex.name}</span>
                </div>
                <div className="flex items-center space-x-1 flex-shrink-0">
                  <button
                    onClick={() => moveItem(idx, idx - 1)}
                    disabled={idx === 0}
                    className="p-1.5 text-gray-400 hover:text-white disabled:opacity-30 disabled:pointer-events-none"
                  >
                    <Icon name="chevron-up" className="w-4 h-4" />
                  </button>
                  <button
                    onClick={() => moveItem(idx, idx + 1)}
                    disabled={idx === order.length - 1}
                    className="p-1.5 text-gray-400 hover:text-white disabled:opacity-30 disabled:pointer-events-none"
                  >
                    <Icon name="chevron-down" className="w-4 h-4" />
                  </button>
                  <button
                    onClick={() => handleDeleteClick(ex.id)}
                    className="p-1.5 text-gray-500 hover:text-red-400"
                    title="운동 삭제"
                  >
                    <Icon name="trash-2" className="w-4 h-4" />
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ============================================================================
    // 운동 교체 팝업 모달 컴포넌트
    // ============================================================================
    function ReplaceExerciseModal({ exerciseDb, currentExercise, onClose, onSelectReplace }) {
      // 동일 부위의 다른 운동 필터링
      const samePartExercises = useMemo(() => {
        return exerciseDb.filter(ex => ex.partId === currentExercise.partId && ex.id !== currentExercise.id);
      }, [exerciseDb, currentExercise]);

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-sm max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
            <div className="p-4 border-b border-gray-800 flex justify-between items-center bg-[#252525]">
              <div>
                <h3 className="font-bold text-base text-gray-100">운동 교체</h3>
                <p className="text-xs text-blue-400">{currentExercise.name} ➡️ 대체할 운동 선택</p>
              </div>
              <button onClick={onClose} className="p-1 text-gray-400 hover:text-white">
                <Icon name="x" />
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-3 space-y-2">
              {samePartExercises.length === 0 ? (
                <div className="text-center py-8 text-xs text-gray-500">
                  동일 부위 대체 가능 운동이 없습니다.
                </div>
              ) : (
                samePartExercises.map((ex) => (
                  <div
                    key={ex.id}
                    onClick={() => onSelectReplace(ex)}
                    className="bg-[#282828] hover:bg-[#323232] border border-gray-700/60 rounded-xl p-3 flex items-center justify-between cursor-pointer transition-all active:scale-98"
                  >
                    <div>
                      <div className="font-bold text-sm text-gray-200">{ex.name}</div>
                      <div className="text-xs text-gray-400">{ex.category} • {ex.equipment}</div>
                    </div>
                    <span className="text-xs bg-blue-600 text-white font-bold px-2.5 py-1 rounded-lg">
                      교체
                    </span>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 세트 호출 모달 (동일 운동의 과거 날짜 세트 구성을 불러와 현재 세트에 덮어쓰기)
    // ============================================================================
    function LoadSetsModal({ exercise, workoutLogs, currentDate, onClose, onLoad }) {
      const history = useMemo(() => {
        const rows = [];
        Object.keys(workoutLogs).sort((a, b) => b.localeCompare(a)).forEach(date => {
          const log = workoutLogs[date];
          if (!log.exercises) return;
          const match = log.exercises.find(e => e.id === exercise.id);
          if (match && match.sets && match.sets.length > 0) {
            rows.push({ date, sets: match.sets });
          }
        });
        return rows;
      }, [workoutLogs, exercise.id]);

      return (
        <div className="fixed inset-0 bg-[#121212] z-50 flex flex-col">
          <div className="p-3 bg-[#1E1E1E] border-b border-gray-800 flex items-center space-x-3 flex-shrink-0">
            <button onClick={onClose} className="p-1 text-gray-400 hover:text-white">
              <Icon name="chevron-left" className="w-6 h-6" />
            </button>
            <span className="text-sm font-bold text-gray-200">세트 불러오기</span>
          </div>

          <div className="px-4 py-3 text-xs text-gray-400 border-b border-gray-800/60 flex-shrink-0">
            {exercise.name}
          </div>

          <div className="flex-1 overflow-y-auto p-3 space-y-3">
            {history.length === 0 ? (
              <div className="text-center py-16 text-xs text-gray-500">
                이전에 기록된 세트가 없습니다.
              </div>
            ) : (
              history.map((row, idx) => {
                const isCurrent = row.date === currentDate;
                return (
                  <div key={idx} className="bg-[#1E1E1E] border border-gray-800/80 rounded-xl p-3">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-bold text-gray-100">{row.date}</span>
                      {isCurrent ? (
                        <span className="text-[10px] font-bold text-rose-400">현재 세트</span>
                      ) : (
                        <button
                          onClick={() => onLoad(row.sets)}
                          className="text-xs bg-blue-600 hover:bg-blue-500 text-white font-bold px-2.5 py-1 rounded-lg"
                        >
                          불러오기
                        </button>
                      )}
                    </div>
                    <div className="grid grid-cols-4 gap-1.5">
                      {row.sets.map(s => (
                        <div key={s.setNum} className="bg-[#282828] rounded-lg p-1.5 text-center">
                          <div className="text-[9px] text-gray-500">{s.setNum}세트</div>
                          <div className="text-xs font-mono text-gray-100 font-bold">{s.weight}kg</div>
                          <div className="text-xs font-mono text-gray-300">{s.reps}회</div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    // ============================================================================
    // 루틴 저장 모달 (새 루틴 만들기 또는 기존 루틴에 덮어쓰기)
    // ============================================================================
    function SaveRoutineModal({ routines, exercises, onClose, onSaveNew, onOverwrite }) {
      const [newName, setNewName] = useState('');

      const partSummary = useMemo(() => {
        const partNames = [...new Set(exercises.map(ex => {
          const bp = BODY_PARTS.find(p => p.id === ex.partId);
          return bp ? bp.name : '';
        }).filter(Boolean))];
        return partNames.join(', ');
      }, [exercises]);

      return (
        <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-[60]" onClick={onClose}>
          <div
            className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-sm max-h-[80vh] flex flex-col shadow-2xl overflow-hidden"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="p-4 border-b border-gray-800 flex justify-between items-center bg-[#252525] flex-shrink-0">
              <div>
                <h3 className="font-bold text-base text-gray-100">루틴 저장</h3>
                <p className="text-xs text-gray-400 mt-0.5">{partSummary} • {exercises.length}개 운동</p>
              </div>
              <button onClick={onClose} className="p-1 text-gray-400 hover:text-white">
                <Icon name="x" />
              </button>
            </div>

            <div className="p-4 border-b border-gray-800/60 flex-shrink-0 space-y-2">
              <div className="text-xs text-gray-400 font-semibold">새 루틴으로 저장</div>
              <div className="flex space-x-2">
                <input
                  type="text"
                  value={newName}
                  onChange={(e) => setNewName(e.target.value)}
                  placeholder="루틴 이름 (예: 등, 이두)"
                  className="flex-1 bg-[#121212] border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-blue-500"
                />
                <button
                  onClick={() => { if (newName.trim()) onSaveNew(newName.trim(), exercises); }}
                  disabled={!newName.trim()}
                  className="px-3 py-2 bg-blue-600 hover:bg-blue-500 disabled:bg-gray-800 disabled:text-gray-500 text-white text-xs font-bold rounded-lg flex-shrink-0"
                >
                  저장
                </button>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-2">
              <div className="text-xs text-gray-400 font-semibold mb-1">기존 루틴에 덮어쓰기</div>
              {routines.length === 0 ? (
                <div className="text-center py-8 text-xs text-gray-500">
                  저장된 루틴이 없습니다.
                </div>
              ) : (
                routines.map(r => (
                  <div key={r.id} className="bg-[#282828] border border-gray-700/60 rounded-xl p-3 flex items-center justify-between">
                    <div className="min-w-0">
                      <div className="flex items-center space-x-1.5">
                        <span className={`w-2 h-2 rounded-full flex-shrink-0 ${r.color ? r.color.bg : 'bg-blue-600'}`}></span>
                        <span className="font-bold text-sm text-gray-100 truncate">{r.name}</span>
                      </div>
                      <div className="text-[11px] text-gray-400 mt-0.5 truncate">{r.partSummary} • {r.exercises.length}개 운동</div>
                    </div>
                    <button
                      onClick={async () => {
                        if (await window.appConfirm(`'${r.name}' 루틴을 현재 운동 조합으로 덮어쓸까요?`)) {
                          onOverwrite(r.id, exercises);
                        }
                      }}
                      className="text-xs bg-gray-700 hover:bg-gray-600 text-white font-bold px-2.5 py-1.5 rounded-lg flex-shrink-0 ml-2"
                    >
                      덮어쓰기
                    </button>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 운동별 정보 / 히스토리 / 차트 모달 (유튜브 영상 링크 포함)
    // ============================================================================
    function ExerciseInfoModal({ exercise, workoutLogs, onClose }) {
      const [tab, setTab] = useState('정보');

      // 전체 운동 기록에서 동일 운동(id) 이력 수집 (최신순)
      const history = useMemo(() => {
        const rows = [];
        Object.keys(workoutLogs).sort((a, b) => b.localeCompare(a)).forEach(date => {
          const log = workoutLogs[date];
          if (!log.exercises) return;
          const match = log.exercises.find(e => e.id === exercise.id);
          if (match) rows.push({ date, exercise: match });
        });
        return rows;
      }, [workoutLogs, exercise.id]);

      const stats = useMemo(() => {
        let totalSets = 0;
        let bestVolume = 0;
        let best1RM = 0;
        history.forEach(row => {
          const sets = row.exercise.sets || [];
          totalSets += sets.filter(s => s.completed).length;
          const vol = sets.reduce((sum, s) => sum + (s.completed ? s.weight * s.reps : 0), 0);
          if (vol > bestVolume) bestVolume = vol;
          if (row.exercise.pr1RM > best1RM) best1RM = row.exercise.pr1RM;
        });
        return { sessions: history.length, totalSets, bestVolume, best1RM };
      }, [history]);

      const youtubeSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(exercise.name + ' 운동 방법')}`;

      return (
        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
          <div className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-sm max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div className="p-4 border-b border-gray-800 flex justify-between items-center bg-[#252525]">
              <h3 className="font-bold text-base text-gray-100">{exercise.name}</h3>
              <button onClick={onClose} className="p-1 text-gray-400 hover:text-white">
                <Icon name="x" />
              </button>
            </div>

            <div className="flex border-b border-gray-800 bg-[#1A1A1A] text-xs font-semibold flex-shrink-0">
              {['정보', '히스토리', '차트'].map(t => (
                <button
                  key={t}
                  onClick={() => setTab(t)}
                  className={`flex-1 py-2.5 transition-colors ${
                    tab === t ? 'text-blue-400 border-b-2 border-blue-500 bg-[#222834]' : 'text-gray-400 hover:text-gray-200'
                  }`}
                >
                  {t === '정보' ? '운동 정보' : t}
                </button>
              ))}
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {tab === '정보' && (
                <div className="space-y-4">
                  <div className="grid grid-cols-3 gap-2 text-center">
                    <div className="bg-[#282828] rounded-lg p-2">
                      <div className="text-[10px] text-gray-400">수행 횟수</div>
                      <div className="text-sm font-bold text-white">{stats.sessions}일</div>
                    </div>
                    <div className="bg-[#282828] rounded-lg p-2">
                      <div className="text-[10px] text-gray-400">총 세트</div>
                      <div className="text-sm font-bold text-white">{stats.totalSets}세트</div>
                    </div>
                    <div className="bg-[#282828] rounded-lg p-2">
                      <div className="text-[10px] text-gray-400">최고 1RM</div>
                      <div className="text-sm font-bold text-blue-400">{stats.best1RM || '-'} kg</div>
                    </div>
                  </div>

                  <a
                    href={youtubeSearchUrl}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="w-full py-2.5 bg-red-600/90 hover:bg-red-600 text-white text-sm font-bold rounded-xl flex items-center justify-center space-x-2"
                  >
                    <Icon name="youtube" className="w-4 h-4" />
                    <span>동영상으로 자세 확인하기</span>
                  </a>

                  <p className="text-xs text-gray-500 leading-relaxed">
                    유튜브에서 '{exercise.name}' 검색 결과로 연결됩니다. 정확한 자세와 호흡법을 영상으로 확인해보세요.
                  </p>
                </div>
              )}

              {tab === '히스토리' && (
                <div className="space-y-2">
                  {history.length === 0 ? (
                    <div className="text-center py-10 text-xs text-gray-500">아직 기록된 이력이 없습니다.</div>
                  ) : (
                    history.map((row, idx) => (
                      <div key={idx} className="bg-[#282828] rounded-lg p-2.5">
                        <div className="text-xs font-bold text-blue-400 mb-1">{row.date}</div>
                        <div className="grid grid-cols-4 gap-1 text-[10px] text-gray-300">
                          {row.exercise.sets.map(s => (
                            <div key={s.setNum} className="bg-[#1E1E1E] rounded p-1 text-center">
                              <div className="text-gray-500">{s.setNum}세트</div>
                              <div className="font-mono">{s.weight}kg</div>
                              <div className="font-mono">{s.reps}회</div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {tab === '차트' && (
                <div className="space-y-3">
                  {history.length === 0 ? (
                    <div className="text-center py-10 text-xs text-gray-500">차트를 표시할 데이터가 없습니다.</div>
                  ) : (
                    <>
                      <div className="text-xs text-gray-400 mb-1">세션별 볼륨 추이 (최근 → 과거)</div>
                      <div className="flex items-end space-x-1.5 h-32 bg-[#181818] rounded-lg p-2">
                        {history.slice(0, 10).reverse().map((row, idx) => {
                          const vol = row.exercise.sets.reduce((sum, s) => sum + (s.completed ? s.weight * s.reps : 0), 0);
                          const maxVol = Math.max(...history.slice(0, 10).map(r => r.exercise.sets.reduce((s2, s) => s2 + (s.completed ? s.weight * s.reps : 0), 0)), 1);
                          const heightPct = Math.max(4, (vol / maxVol) * 100);
                          return (
                            <div key={idx} className="flex-1 flex flex-col items-center justify-end h-full">
                              <div className="text-[8px] text-gray-400 mb-0.5">{vol}</div>
                              <div className="w-full bg-blue-500 rounded-t" style={{ height: `${heightPct}%` }}></div>
                            </div>
                          );
                        })}
                      </div>
                      <div className="space-y-1">
                        {history.slice(0, 8).map((row, idx) => {
                          const vol = row.exercise.sets.reduce((sum, s) => sum + (s.completed ? s.weight * s.reps : 0), 0);
                          return (
                            <div key={idx} className="flex justify-between text-[11px] text-gray-400 border-b border-gray-800/60 pb-1">
                              <span>{row.date}</span>
                              <span className="text-gray-200 font-mono">{vol} kg</span>
                            </div>
                          );
                        })}
                      </div>
                    </>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
