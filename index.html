        const willBeCompleted = !targetSet.completed;
        const isLastSetOfExercise = setIdx === targetExercise.sets.length - 1;

        const newSets = targetExercise.sets.map((s, i) => i === setIdx ? { ...s, completed: willBeCompleted } : s);
        const updatedExercises = activeSession.exercises.map((ex, i) => i === exIdx ? { ...ex, sets: newSets } : ex);
        setActiveSession({ ...activeSession, exercises: updatedExercises });

        if (willBeCompleted) {
          startTimer(targetSet.restSeconds || 60);

          // 해당 운동의 마지막 세트를 완료하면 자동으로 다음 운동으로 스와이프 이동
          if (isLastSetOfExercise && exIdx === currentExIndex && exIdx < updatedExercises.length - 1) {
            setTimeout(() => {
              setCurrentExIndex(exIdx + 1);
            }, 450);
          }
        }
      };

      const handleUpdateSetField = (exIdx, setIdx, field, delta) => {
        if (!activeSession) return;
        const targetExercise = activeSession.exercises[exIdx];
        const targetSet = targetExercise.sets[setIdx];
        const newSet = { ...targetSet };

        if (field === 'weight') newSet.weight = Math.max(0, targetSet.weight + delta);
        if (field === 'reps') newSet.reps = Math.max(1, targetSet.reps + delta);
        if (field === 'restSeconds') newSet.restSeconds = Math.max(10, targetSet.restSeconds + delta);

        const newSets = targetExercise.sets.map((s, i) => i === setIdx ? newSet : s);
        const updatedExercises = activeSession.exercises.map((ex, i) => i === exIdx ? { ...ex, sets: newSets } : ex);
        setActiveSession({ ...activeSession, exercises: updatedExercises });
      };

      // 무게/횟수 직접 입력 (절대값 지정)
      const handleSetFieldDirect = (exIdx, setIdx, field, value) => {
        if (!activeSession) return;
        const num = Number(value);
        if (Number.isNaN(num)) return;

        const targetExercise = activeSession.exercises[exIdx];
        const targetSet = targetExercise.sets[setIdx];
        const newSet = { ...targetSet };

        if (field === 'weight') newSet.weight = Math.max(0, num);
        if (field === 'reps') newSet.reps = Math.max(0, Math.round(num));
        if (field === 'restSeconds') newSet.restSeconds = Math.max(0, Math.round(num));

        const newSets = targetExercise.sets.map((s, i) => i === setIdx ? newSet : s);
        const updatedExercises = activeSession.exercises.map((ex, i) => i === exIdx ? { ...ex, sets: newSets } : ex);
        setActiveSession({ ...activeSession, exercises: updatedExercises });
      };

      // 세트 원버튼 삭제
      const handleDeleteSet = (exIdx, setIdx) => {
        if (!activeSession) return;
        const targetExercise = activeSession.exercises[exIdx];

        if (targetExercise.sets.length <= 1) {
          window.appAlert("최소 1개 이상의 세트가 유지되어야 합니다.");
          return;
        }

        const newSets = targetExercise.sets
          .filter((s, i) => i !== setIdx)
          .map((s, idx) => ({ ...s, setNum: idx + 1 }));
        const updatedExercises = activeSession.exercises.map((ex, i) => i === exIdx ? { ...ex, sets: newSets } : ex);

        setActiveSession({ ...activeSession, exercises: updatedExercises });
      };

      // 세트 순서를 드래그 앤 드롭으로 재배열 (세트 번호 재부여)
      const handleReorderSets = (exIdx, newSetsOrder) => {
        if (!activeSession) return;
        const updatedExercises = activeSession.exercises.map((ex, i) => i === exIdx ? {
          ...ex,
          sets: newSetsOrder.map((s, idx) => ({ ...s, setNum: idx + 1 }))
        } : ex);
        setActiveSession({ ...activeSession, exercises: updatedExercises });
      };

      // 무게 운동 ↔ 맨몸(횟수 카운팅) 운동 모드 전환
      const handleToggleBodyweightMode = (exIdx) => {
        if (!activeSession) return;
        const updatedExercises = activeSession.exercises.map((ex, i) => i === exIdx ? {
          ...ex,
          isBodyweight: !ex.isBodyweight
        } : ex);
        setActiveSession({ ...activeSession, exercises: updatedExercises });
      };

      const handleAddSet = (exIdx) => {
        if (!activeSession) return;
        const targetExercise = activeSession.exercises[exIdx];
        const sets = targetExercise.sets;
        const lastSet = sets[sets.length - 1] || { weight: 40, reps: 10, restSeconds: 60 };

        const newSets = [
          ...sets,
          {
            setNum: sets.length + 1,
            weight: lastSet.weight,
            reps: lastSet.reps,
            restSeconds: lastSet.restSeconds,
            completed: false
          }
        ];
        const updatedExercises = activeSession.exercises.map((ex, i) => i === exIdx ? { ...ex, sets: newSets } : ex);

        setActiveSession({ ...activeSession, exercises: updatedExercises });
      };

      // 운동 목록 → 세션용 포맷 변환 (공통 헬퍼)
      // 운동 목록 → 세션용 세트 데이터 생성. 루틴에 저장된 세트(무게/횟수/휴식)가 있으면 그걸 그대로 불러오고,
      // 새로 고른 운동(세트 정보 없음)이면 기본 템플릿을 사용
      const formatExercisesForSession = (list) => list.map(ex => {
        const hasSavedSets = Array.isArray(ex.sets) && ex.sets.length > 0;
        const baseSets = hasSavedSets
          ? ex.sets.map((s, i) => ({
              setNum: i + 1,
              weight: s.weight,
              reps: s.reps,
              restSeconds: s.restSeconds || 60,
              completed: false
            }))
          : [
              { setNum: 1, weight: 70, reps: 15, restSeconds: 60, completed: false },
              { setNum: 2, weight: 75, reps: 15, restSeconds: 60, completed: false },
              { setNum: 3, weight: 80, reps: 12, restSeconds: 60, completed: false },
              { setNum: 4, weight: 85, reps: 9, restSeconds: 60, completed: false },
            ];
        return {
          id: ex.id,
          partId: ex.partId,
          name: ex.name,
          // 기구가 '맨몸'인 운동은 기본적으로 맨몸(횟수 카운팅) 모드로 시작 (운동화면에서 언제든 토글 가능)
          isBodyweight: ex.isBodyweight !== undefined ? ex.isBodyweight : !!(ex.equipment && ex.equipment.includes('맨몸')),
          prWeight: 90,
          prReps: 8,
          pr1RM: 112.2,
          sets: baseSets
        };
      });

      // 대기열 운동으로 세션 시작
      const handleStartWorkoutWithStaged = () => {
        const formattedExercises = formatExercisesForSession(stagedExercises);

        const newSession = {
          date: selectedDate,
          exercises: formattedExercises
        };

        setWorkoutLogs(prev => ({
          ...prev,
          [selectedDate]: {
            durationMinutes: 60,
            totalSets: formattedExercises.reduce((sum, e) => sum + e.sets.length, 0),
            breakdown: computeBreakdown(formattedExercises),
            routineName: null,
            routineColor: null,
            exercises: formattedExercises
          }
        }));

        setActiveSession(newSession);
        setCurrentExIndex(0);
        setCurrentView('workout');
        navigatePush();
      };

      // 루틴을 선택 날짜에 바로 적용 (루틴 이름/색상을 캘린더 뱃지로 표시)
      const handleApplyRoutineToDate = (routine, targetDate) => {
        const formattedExercises = formatExercisesForSession(routine.exercises);
        const newSession = { date: targetDate, exercises: formattedExercises };

        setWorkoutLogs(prev => ({
          ...prev,
          [targetDate]: {
            durationMinutes: 60,
            totalSets: formattedExercises.reduce((sum, e) => sum + e.sets.length, 0),
            breakdown: computeBreakdown(formattedExercises),
            routineName: routine.name,
            routineColor: routine.color,
            exercises: formattedExercises
          }
        }));

        setActiveSession(newSession);
        setCurrentExIndex(0);
        setCurrentView('workout');
        setIsRoutineModalOpen(false);
        navigatePush();
      };

      // 운동 진행 중 새 운동 추가
      const handleAddExercisesToSession = (newExercises) => {
        if (!activeSession || newExercises.length === 0) { setIsAddExerciseModalOpen(false); return; }
        const additions = formatExercisesForSession(newExercises);
        const updatedExercises = [...activeSession.exercises, ...additions];
        const updatedSession = { ...activeSession, exercises: updatedExercises };
        setActiveSession(updatedSession);
        setWorkoutLogs(prev => ({
          ...prev,
          [activeSession.date]: {
            ...(prev[activeSession.date] || {}),
            totalSets: updatedExercises.reduce((sum, e) => sum + e.sets.length, 0),
            breakdown: computeBreakdown(updatedExercises),
            exercises: updatedExercises
          }
        }));
        setIsAddExerciseModalOpen(false);
      };

      // 운동 순서 변경 (별도 목록 화면에서 롱탭/드래그 또는 화살표로 조정)
      const handleReorderExercises = (newOrderExercises) => {
        if (!activeSession) return;
        const currentId = activeSession.exercises[currentExIndex] && activeSession.exercises[currentExIndex].id;
        const updatedSession = { ...activeSession, exercises: newOrderExercises };
        setActiveSession(updatedSession);
        setWorkoutLogs(prev => ({
          ...prev,
          [activeSession.date]: {
            ...(prev[activeSession.date] || {}),
            exercises: newOrderExercises
          }
        }));
        const newIdx = newOrderExercises.findIndex(e => e.id === currentId);
        setCurrentExIndex(newIdx >= 0 ? newIdx : 0);
      };

      // 운동 순서 조정 화면에서 운동 자체를 삭제
      const handleDeleteExerciseFromSession = (exerciseId) => {
        if (!activeSession) return;
        if (activeSession.exercises.length <= 1) {
          window.appAlert('최소 1개 이상의 운동이 유지되어야 합니다.');
          return null;
        }
        const newExercises = activeSession.exercises.filter(e => e.id !== exerciseId);
        const updatedSession = { ...activeSession, exercises: newExercises };
        setActiveSession(updatedSession);
        setWorkoutLogs(prev => ({
          ...prev,
          [activeSession.date]: {
            ...(prev[activeSession.date] || {}),
            totalSets: newExercises.reduce((sum, e) => sum + e.sets.length, 0),
            breakdown: computeBreakdown(newExercises),
            exercises: newExercises
          }
        }));
        if (currentExIndex >= newExercises.length) {
          setCurrentExIndex(Math.max(0, newExercises.length - 1));
        }
        return newExercises;
      };

      // 다른 날짜에 기록했던 동일 운동의 세트 구성을 현재 세트에 덮어쓰기
      const handleLoadSetsIntoExercise = (exIdx, historySets) => {
        if (!activeSession) return;
        const updatedExercises = [...activeSession.exercises];
        updatedExercises[exIdx] = {
          ...updatedExercises[exIdx],
          sets: historySets.map((s, idx) => ({
            setNum: idx + 1,
            weight: s.weight,
            reps: s.reps,
            restSeconds: s.restSeconds || 60,
            completed: false
          }))
        };
        setActiveSession({ ...activeSession, exercises: updatedExercises });
      };

      // 날짜 롱탭 → 복사 / 이동 / 삭제
      const handleDeleteDateLog = (date) => {
        setWorkoutLogs(prev => {
          const next = { ...prev };
          delete next[date];
          return next;
        });
        setDateActionState(null);
      };

      const handleCopyDateLog = (fromDate, toDate) => {
        setWorkoutLogs(prev => {
          if (!prev[fromDate]) return prev;
          return { ...prev, [toDate]: JSON.parse(JSON.stringify(prev[fromDate])) };
        });
        setDateActionState(null);
      };

      const handleMoveDateLog = (fromDate, toDate) => {
        setWorkoutLogs(prev => {
          if (!prev[fromDate]) return prev;
          const next = { ...prev, [toDate]: JSON.parse(JSON.stringify(prev[fromDate])) };
          delete next[fromDate];
          return next;
        });
        setDateActionState(null);
      };

      // 교체 수행 핸들러
      const handleReplaceExercise = (newEx) => {
        if (!activeSession) return;
        const updatedExercises = [...activeSession.exercises];
        
        updatedExercises[currentExIndex] = {
          id: newEx.id,
          partId: newEx.partId,
          name: newEx.name,
          prWeight: 80,
          prReps: 10,
          pr1RM: 100,
          sets: [
            { setNum: 1, weight: 50, reps: 12, restSeconds: 60, completed: false },
            { setNum: 2, weight: 55, reps: 12, restSeconds: 60, completed: false },
            { setNum: 3, weight: 60, reps: 10, restSeconds: 60, completed: false },
          ]
        };

        setActiveSession({ ...activeSession, exercises: updatedExercises });
        setIsReplaceModalOpen(false);
      };

      return (
        <div className="flex flex-col h-full w-full bg-[#121212] text-gray-100 font-sans overflow-hidden">
          {currentView === 'calendar' && (
            <CalendarView 
              selectedDate={selectedDate}
              setSelectedDate={setSelectedDate}
              workoutLogs={workoutLogs}
              routines={routines}
              isRoutineModalOpen={isRoutineModalOpen}
              onOpenRoutineModal={() => { setIsRoutineModalOpen(true); navigatePush(); }}
              onCloseRoutineModal={() => setIsRoutineModalOpen(false)}
              onApplyRoutine={(routine) => handleApplyRoutineToDate(routine, selectedDate)}
              onRenameRoutine={handleRenameRoutine}
              dateActionState={dateActionState}
              setDateActionState={(state) => { setDateActionState(state); if (state) navigatePush(); }}
              onDeleteDateLog={handleDeleteDateLog}
              onCopyDateLog={handleCopyDateLog}
              onMoveDateLog={handleMoveDateLog}
              isDataTransferModalOpen={isDataTransferModalOpen}
              onOpenDataTransferModal={() => { setIsDataTransferModalOpen(true); navigatePush(); }}
              onCloseDataTransferModal={() => setIsDataTransferModalOpen(false)}
              onExportData={handleExportData}
              onImportData={handleImportData}
              onOpenExerciseSelect={() => {
                setStagedExercises([]);
                setCurrentView('select');
                navigatePush();
              }}
              onOpenWorkoutDetail={(date) => {
                const dayData = workoutLogs[date];
                if (dayData && dayData.exercises && dayData.exercises.length > 0) {
                  setActiveSession({ date, exercises: dayData.exercises });
                  setCurrentExIndex(0);
                  setCurrentView('workout');
                } else {
                  setStagedExercises([]);
                  setCurrentView('select');
                }
                navigatePush();
              }}
            />
          )}

          {currentView === 'select' && (
            <MultiDepthSelectView 
              exerciseDb={exerciseDb}
              onToggleFavorite={handleToggleFavorite}
              onCreateCustomExercise={handleCreateCustomExercise}
              routines={routines}
              onSaveRoutine={handleSaveRoutine}
              onOverwriteRoutine={handleOverwriteRoutine}
              onDeleteRoutine={handleDeleteRoutine}
              onRenameRoutine={handleRenameRoutine}
              stagedExercises={stagedExercises}
              setStagedExercises={setStagedExercises}
              onBack={() => setCurrentView('calendar')}
              onComplete={handleStartWorkoutWithStaged}
            />
          )}

          {currentView === 'workout' && activeSession && (
            <WorkoutDetailView 
              activeSession={activeSession}
              currentExIndex={currentExIndex}
              setCurrentExIndex={setCurrentExIndex}
              workoutLogs={workoutLogs}
              onBack={() => setCurrentView('calendar')}
              handleToggleSetComplete={handleToggleSetComplete}
              handleUpdateSetField={handleUpdateSetField}
              handleSetFieldDirect={handleSetFieldDirect}
              handleDeleteSet={handleDeleteSet}
              handleAddSet={handleAddSet}
              onReorderSets={handleReorderSets}
              onToggleBodyweight={handleToggleBodyweightMode}
              weightUnit={weightUnit}
              setWeightUnit={setWeightUnit}
              onLoadSets={handleLoadSetsIntoExercise}
              onOpenReplace={() => { setIsReplaceModalOpen(true); navigatePush(); }}
              onOpenAddExercise={() => { setIsAddExerciseModalOpen(true); navigatePush(); }}
              onOpenExerciseInfo={(ex) => { setExerciseInfoTarget(ex); navigatePush(); }}
              routines={routines}
              onSaveRoutine={handleSaveRoutine}
              onOverwriteRoutine={handleOverwriteRoutine}
              onReorderExercises={handleReorderExercises}
              onDeleteExerciseFromSession={handleDeleteExerciseFromSession}
              timerActive={timerActive}
              timerTotal={timerTotal}
              timerRemaining={timerRemaining}
              isMuted={isMuted}
              setIsMuted={setIsMuted}
              startTimer={startTimer}
              stopTimer={stopTimer}
              addTimerSeconds={addTimerSeconds}
            />
          )}

          {/* 운동 교체 모달 팝업 */}
          {isReplaceModalOpen && activeSession && (
            <ReplaceExerciseModal 
              exerciseDb={exerciseDb}
              currentExercise={activeSession.exercises[currentExIndex]}
              onClose={() => setIsReplaceModalOpen(false)}
              onSelectReplace={handleReplaceExercise}
            />
          )}

          {/* 운동 중 운동 추가 모달 */}
          {isAddExerciseModalOpen && activeSession && (
            <AddExerciseModal
              exerciseDb={exerciseDb}
              onToggleFavorite={handleToggleFavorite}
              onCreateCustomExercise={handleCreateCustomExercise}
              routines={routines}
              onSaveRoutine={handleSaveRoutine}
              onOverwriteRoutine={handleOverwriteRoutine}
              onDeleteRoutine={handleDeleteRoutine}
              onRenameRoutine={handleRenameRoutine}
              existingIds={activeSession.exercises.map(e => e.id)}
              onClose={() => setIsAddExerciseModalOpen(false)}
              onComplete={handleAddExercisesToSession}
            />
          )}

          {/* 운동 정보 / 히스토리 / 차트 모달 */}
          {exerciseInfoTarget && (
            <ExerciseInfoModal
              exercise={exerciseInfoTarget}
              workoutLogs={workoutLogs}
              onClose={() => setExerciseInfoTarget(null)}
            />
          )}

          {/* 앱 스타일 alert/confirm 팝업 (브라우저 기본 팝업 대체) */}
          <AppDialogModal dialogState={dialogState} onClose={() => setDialogState(null)} />
        </div>
      );
    }

    // ============================================================================
    // 화면 1: 캘린더 메인 화면
    // ============================================================================
    function CalendarView({
      selectedDate, setSelectedDate, workoutLogs, onOpenExerciseSelect, onOpenWorkoutDetail,
      routines, isRoutineModalOpen, onOpenRoutineModal, onCloseRoutineModal, onApplyRoutine, onRenameRoutine,
      dateActionState, setDateActionState, onDeleteDateLog, onCopyDateLog, onMoveDateLog,
      isDataTransferModalOpen, onOpenDataTransferModal, onCloseDataTransferModal, onExportData, onImportData
    }) {
      const [currentYearMonth, setCurrentYearMonth] = useState(() => {
        const now = new Date();
        return { year: now.getFullYear(), month: now.getMonth() + 1 };
      });
      const [isMonthPickerOpen, setIsMonthPickerOpen] = useState(false);
      const [renamingRoutineId, setRenamingRoutineId] = useState(null);
      const [renameValue, setRenameValue] = useState('');
      const touchStartXRef = useRef(null);
      const longPressTimerRef = useRef(null);
      const longPressFiredRef = useRef(false);

      // 날짜 드래그 앤 드롭 (이동/복사/삭제)
      const draggingDateRef = useRef(null);
      const dragOverDateRef = useRef(null);
      const isOverDeleteZoneRef = useRef(false);
      const [draggingDate, setDraggingDate] = useState(null);
      const [dragOverDate, setDragOverDate] = useState(null);
      const [isOverDeleteZone, setIsOverDeleteZone] = useState(false);

      // 롱탭으로 드래그 시작 (기록이 있는 날짜만 드래그 가능)
      const handleDayPressStart = (dateStr, hasLog) => {
        longPressFiredRef.current = false;
        if (!hasLog) return;
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);
        longPressTimerRef.current = setTimeout(() => {
          longPressFiredRef.current = true;
          draggingDateRef.current = dateStr;
          setDraggingDate(dateStr);
          if (navigator.vibrate) navigator.vibrate(40);
        }, 400);
      };

      const handleDayTouchMove = (e) => {
        if (!draggingDateRef.current) return;
        e.preventDefault();
        const touch = e.touches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);

        const deleteZoneEl = el && el.closest && el.closest('[data-delete-zone]');
        if (deleteZoneEl) {
          if (!isOverDeleteZoneRef.current) {
            isOverDeleteZoneRef.current = true;
            setIsOverDeleteZone(true);
            if (navigator.vibrate) navigator.vibrate(25);
          }
          if (dragOverDateRef.current) { dragOverDateRef.current = null; setDragOverDate(null); }
          return;
        }
        if (isOverDeleteZoneRef.current) { isOverDeleteZoneRef.current = false; setIsOverDeleteZone(false); }

        const dayEl = el && el.closest && el.closest('[data-cal-date]');
        const overDate = dayEl ? dayEl.getAttribute('data-cal-date') : null;
        if (overDate !== dragOverDateRef.current) {
          dragOverDateRef.current = overDate;
          setDragOverDate(overDate);
        }
      };

      const handleDayPressEnd = async () => {
        if (longPressTimerRef.current) clearTimeout(longPressTimerRef.current);

        if (draggingDateRef.current) {
          const fromDate = draggingDateRef.current;
          if (isOverDeleteZoneRef.current) {
            if (await window.appConfirm(`${fromDate} 기록을 삭제할까요?`)) {
              onDeleteDateLog(fromDate);
            }
          } else if (dragOverDateRef.current && dragOverDateRef.current !== fromDate) {
            setDateActionState({ fromDate, toDate: dragOverDateRef.current });
          }
        }

        draggingDateRef.current = null;
        dragOverDateRef.current = null;
        isOverDeleteZoneRef.current = false;
        setDraggingDate(null);
        setDragOverDate(null);
        setIsOverDeleteZone(false);
      };

      // 마우스로 테스트할 때, 삭제존이나 빈 공간 등 어디서 버튼을 놓아도 드래그가 확실히 종료되도록 전역 리스너 등록
      useEffect(() => {
        if (!draggingDate) return;
        window.addEventListener('mouseup', handleDayPressEnd);
        return () => window.removeEventListener('mouseup', handleDayPressEnd);
      }, [draggingDate]);

      const lastTapRef = useRef({ date: null, time: 0 });

      const handleDayClick = (dateStr) => {
        if (longPressFiredRef.current) { longPressFiredRef.current = false; return; }

        const now = Date.now();
        if (lastTapRef.current.date === dateStr && now - lastTapRef.current.time < 350) {
          // 더블탭 감지 → 바로 운동 화면으로 진입 (기록 있으면 기록보기, 없으면 운동추가)
          lastTapRef.current = { date: null, time: 0 };
          setSelectedDate(dateStr);
          onOpenWorkoutDetail(dateStr);
          return;
        }
        lastTapRef.current = { date: dateStr, time: now };
        setSelectedDate(dateStr);
      };

      // 드래그 중이 아니면 손가락이 움직일 때 롱프레스(=드래그 시작)를 취소해 스크롤과 충돌하지 않게 함
      const handleCellTouchMove = (e) => {
        if (draggingDateRef.current) {
          handleDayTouchMove(e);
        } else if (longPressTimerRef.current) {
          clearTimeout(longPressTimerRef.current);
        }
      };

      // 데스크톱 마우스로 테스트할 때도 동일하게 동작하도록 마우스 이동 추적 (터치 로직과 동일)
      const handleCellMouseMove = (e) => {
        if (!draggingDateRef.current) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);

        const deleteZoneEl = el && el.closest && el.closest('[data-delete-zone]');
        if (deleteZoneEl) {
          if (!isOverDeleteZoneRef.current) {
            isOverDeleteZoneRef.current = true;
            setIsOverDeleteZone(true);
          }
          if (dragOverDateRef.current) { dragOverDateRef.current = null; setDragOverDate(null); }
          return;
        }
        if (isOverDeleteZoneRef.current) { isOverDeleteZoneRef.current = false; setIsOverDeleteZone(false); }

        const dayEl = el && el.closest && el.closest('[data-cal-date]');
        const overDate = dayEl ? dayEl.getAttribute('data-cal-date') : null;
        if (overDate !== dragOverDateRef.current) {
          dragOverDateRef.current = overDate;
          setDragOverDate(overDate);
        }
      };

      const formattedMonthStr = `${currentYearMonth.year}.${String(currentYearMonth.month).padStart(2, '0')}`;

      const handleTouchStart = (e) => {
        touchStartXRef.current = e.touches[0].clientX;
      };

      const handleTouchEnd = (e) => {
        if (touchStartXRef.current === null) return;
        const diffX = touchStartXRef.current - e.changedTouches[0].clientX;

        if (Math.abs(diffX) > 50) {
          if (diffX > 0) changeMonth(1);
          else changeMonth(-1);
        }
        touchStartXRef.current = null;
      };

      const changeMonth = (delta) => {
        setCurrentYearMonth(prev => {
          let newM = prev.month + delta;
          let newY = prev.year;
          if (newM > 12) { newM = 1; newY += 1; }
          if (newM < 1) { newM = 12; newY -= 1; }
          return { year: newY, month: newM };
        });
      };

      const weeksData = [
        { weekNum: '30주', time: '5.2h', sets: '150s' },
        { weekNum: '31주', time: '5.2h', sets: '145s' },
        { weekNum: '32주', time: '4.1h', sets: '110s' },
        { weekNum: '33주', time: '5.8h', sets: '151s' },
        { weekNum: '34주', time: '3.8h', sets: '141s' },
        { weekNum: '35주', time: '0.9h', sets: '9s' },
      ];

      const calendarDays = useMemo(() => {
        const { year, month } = currentYearMonth;
        const firstDay = new Date(year, month - 1, 1).getDay();
        const daysInMonth = new Date(year, month, 0).getDate();
        const daysInPrevMonth = new Date(year, month - 1, 0).getDate();

        const days = [];

        const prevMonthVal = month === 1 ? 12 : month - 1;
        const prevYearVal = month === 1 ? year - 1 : year;
        for (let i = firstDay - 1; i >= 0; i--) {
          const dayNum = daysInPrevMonth - i;
          const dateStr = `${prevYearVal}-${String(prevMonthVal).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
          days.push({ day: dayNum, date: dateStr, isPrev: true });
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          days.push({ day: d, date: dateStr, isCurrentMonth: true });
        }

        const nextMonthVal = month === 12 ? 1 : month + 1;
        const nextYearVal = month === 12 ? year + 1 : year;
        const remaining = 42 - days.length;
        for (let n = 1; n <= remaining; n++) {
          const dateStr = `${nextYearVal}-${String(nextMonthVal).padStart(2, '0')}-${String(n).padStart(2, '0')}`;
          days.push({ day: n, date: dateStr, isNext: true });
        }

        return days;
      }, [currentYearMonth]);

      const selectedDayLog = workoutLogs[selectedDate];

      return (
        <div className="flex flex-col h-full bg-[#121212] overflow-hidden">
          <div className="flex items-center justify-between px-4 py-3 bg-[#1E1E1E] border-b border-gray-800 flex-shrink-0">
            <button className="p-1 text-gray-400 hover:text-white"><Icon name="layers" /></button>
            
            <div className="flex items-center space-x-2">
              <button onClick={() => changeMonth(-1)} className="p-1 text-gray-400 hover:text-white">
                <Icon name="chevron-left" className="w-4 h-4" />
              </button>
              <button 
                onClick={() => setIsMonthPickerOpen(true)}
                className="flex items-center space-x-1.5 bg-[#282828] hover:bg-[#333333] px-3 py-1.5 rounded-lg border border-gray-700 transition-colors"
              >
                <Icon name="calendar" className="w-4 h-4 text-blue-400" />
                <span className="text-base font-bold tracking-tight text-white">{formattedMonthStr}</span>
                <Icon name="chevron-down" className="w-4 h-4 text-gray-400" />
              </button>
              <button onClick={() => changeMonth(1)} className="p-1 text-gray-400 hover:text-white">
                <Icon name="chevron-right" className="w-4 h-4" />
              </button>
            </div>

            <div className="flex items-center space-x-3 text-gray-300">
              <button onClick={() => setIsMonthPickerOpen(true)} className="p-1 hover:text-white"><Icon name="calendar" /></button>
              <button className="p-1 hover:text-white"><Icon name="award" /></button>
              <button onClick={onOpenDataTransferModal} className="p-1 hover:text-white" title="데이터 내보내기/가져오기"><Icon name="more-vertical" /></button>
            </div>
          </div>

          {/* 요일 헤더 (일요일 빨강, 토요일 파랑) */}
          <div className="flex border-b border-gray-800/60 flex-shrink-0">
            <div className="w-14 flex-shrink-0 bg-[#181818] border-r border-gray-800/60"></div>
            <div className="flex-1 grid grid-cols-7">
              {['일', '월', '화', '수', '목', '금', '토'].map((d, i) => (
                <div
                  key={i}
                  className={`text-center text-[11px] font-bold py-1.5 ${
                    i === 0 ? 'text-red-400' : i === 6 ? 'text-blue-400' : 'text-gray-400'
                  }`}
                >
                  {d}
                </div>
              ))}
            </div>
          </div>

          <div 
            onTouchStart={handleTouchStart}
            onTouchEnd={handleTouchEnd}
            className="flex-1 flex overflow-hidden"
          >
            <div className="w-14 bg-[#181818] border-r border-gray-800/60 flex flex-col pt-1 text-xs text-gray-400 flex-shrink-0">
              {weeksData.map((week, idx) => (
                <div key={idx} className="flex-1 flex flex-col justify-center items-center px-0.5 border-b border-gray-800/40">
                  <span className="font-semibold text-gray-300 text-[11px]">{week.weekNum}</span>
                  <span className="text-[9px] text-gray-500">{week.time}</span>
                  <span className="text-[9px] text-blue-400">{week.sets}</span>
                </div>
              ))}
            </div>

            <div className="flex-1 grid grid-cols-7 grid-rows-6 gap-[1px] bg-gray-800/40 overflow-y-auto">
              {calendarDays.map((item, idx) => {
                const dateStr = item.date;
                const log = dateStr ? workoutLogs[dateStr] : null;
                const isSelected = selectedDate === dateStr;
                const dow = dateStr ? new Date(dateStr + 'T00:00:00').getDay() : null; // 0=일, 6=토
                const isHoliday = dateStr && KR_HOLIDAYS.has(dateStr);
                const isSunOrHoliday = dow === 0 || isHoliday;
                const isSat = dow === 6;

                return (
                  <div
                    key={idx}
                    data-cal-date={dateStr || undefined}
                    onClick={() => dateStr && handleDayClick(dateStr)}
                    onDoubleClick={() => dateStr && onOpenWorkoutDetail(dateStr)}
                    onTouchStart={() => dateStr && handleDayPressStart(dateStr, !!log)}
                    onTouchEnd={handleDayPressEnd}
                    onTouchMove={handleCellTouchMove}
                    onMouseDown={() => dateStr && handleDayPressStart(dateStr, !!log)}
                    onMouseMove={handleCellMouseMove}
                    onMouseUp={handleDayPressEnd}
                    className={`p-1 flex flex-col justify-between cursor-pointer transition-all relative min-h-[92px] ${
                      !item.isCurrentMonth ? 'bg-[#151518] text-gray-500' : 'bg-[#1A1A1A] text-gray-300'
                    } ${isSelected ? 'ring-2 ring-blue-500 bg-[#222834]' : 'hover:bg-[#222222]'} ${
                      draggingDate === dateStr ? 'opacity-40 scale-95' : ''
                    } ${
                      dragOverDate === dateStr && draggingDate && draggingDate !== dateStr
                        ? 'ring-2 ring-emerald-400 bg-[#1B2E24] scale-[1.03] z-10'
                        : ''
                    }`}
                  >
                    <div className="flex justify-between items-center">
                      <span className={`text-xs font-semibold ${
                        !item.isCurrentMonth
                          ? (isSunOrHoliday ? 'text-red-500/50' : isSat ? 'text-blue-400/50' : 'text-gray-500')
                          : (isSunOrHoliday ? 'text-red-400' : isSat ? 'text-blue-400' : 'text-gray-200')
                      }`}>
                        {item.day}
                      </span>
                      {log && !log.routineName && <span className="w-1.5 h-1.5 bg-blue-500 rounded-full"></span>}
                    </div>

                    {log && (
                      <div className="mt-0.5 space-y-0.5 leading-tight overflow-hidden">
                        {log.routineName && (
                          <div className={`inline-block px-1.5 py-0.5 rounded text-[9px] font-bold ${log.routineColor ? log.routineColor.bg : 'bg-blue-600'} ${log.routineColor ? log.routineColor.text : 'text-white'}`}>
                            {log.routineName}
                          </div>
                        )}
                        <div className="bg-[#252A36] border border-blue-900/40 rounded p-1 text-[9px] space-y-0.5">
                          <div className="flex justify-between items-center">
                            <span className="text-blue-300 font-medium">{log.durationMinutes}분</span>
                            <span className="text-gray-400">{log.totalSets}세트</span>
                          </div>
                          {log.breakdown && Object.entries(log.breakdown).slice(0, 3).map(([part, count]) => (
                            <div key={part} className="text-gray-400 truncate">{part} {count}</div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-[#1E1E1E] border-t border-gray-800 p-3 bottom-bar-safe flex items-center justify-between flex-shrink-0 z-10">
            <div>
              <div className="text-sm font-bold text-gray-100">{selectedDate}</div>
              <div className="text-xs text-gray-400">{selectedDayLog ? `${selectedDayLog.totalSets}세트 진행 완료` : '등록된 운동 없음'}</div>
            </div>

            <div className="flex space-x-2">
              <button 
                onClick={() => {
                  const now = new Date();
                  const y = now.getFullYear();
                  const m = now.getMonth() + 1;
                  const d = now.getDate();
                  const todayStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                  setSelectedDate(todayStr);
                  setCurrentYearMonth({ year: y, month: m });
                }} 
                className="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-200 rounded-lg active:scale-95 transition-transform"
              >
                오늘
              </button>
              <button 
                onClick={onOpenRoutineModal}
                className="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-200 rounded-lg active:scale-95 transition-transform"
              >
                루틴
              </button>
              <button 
                onClick={() => onOpenWorkoutDetail(selectedDate)}
                className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white rounded-lg flex items-center space-x-1 shadow-md active:scale-95 transition-transform"
              >
                <span>{selectedDayLog ? '기록 보기' : '운동 추가'}</span>
                <Icon name="arrow-right" className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>

          {/* 루틴 적용 모달 (캘린더에서 바로 루틴 불러오기) */}
          {isRoutineModalOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-sm max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-4 border-b border-gray-800 flex justify-between items-center bg-[#252525]">
                  <div>
                    <h3 className="font-bold text-base text-gray-100">템플릿 선택</h3>
                    <p className="text-xs text-blue-400">{selectedDate}에 루틴 적용</p>
                  </div>
                  <button onClick={onCloseRoutineModal} className="p-1 text-gray-400 hover:text-white">
                    <Icon name="x" />
                  </button>
                </div>
                <div className="flex-1 overflow-y-auto p-3 space-y-2">
                  {routines.length === 0 ? (
                    <div className="text-center py-10 text-xs text-gray-500">
                      저장된 루틴이 없습니다.<br/>운동 추가 화면에서 '루틴' 탭에 저장해보세요.
                    </div>
                  ) : (
                    routines.map(r => (
                      <div key={r.id} className="bg-[#282828] border border-gray-700/60 rounded-xl p-3">
                        <div className="flex justify-between items-start">
                          <div className="flex-1 min-w-0 mr-2">
                            {renamingRoutineId === r.id ? (
                              <div className="flex items-center space-x-1.5 mb-1">
                                <input
                                  type="text"
                                  autoFocus
                                  value={renameValue}
                                  onChange={(e) => setRenameValue(e.target.value)}
                                  onKeyDown={(e) => {
                                    if (e.key === 'Enter') { onRenameRoutine(r.id, renameValue); setRenamingRoutineId(null); }
                                    if (e.key === 'Escape') setRenamingRoutineId(null);
                                  }}
                                  className="flex-1 min-w-0 bg-[#121212] border border-blue-500 rounded px-2 py-1 text-sm text-gray-100 focus:outline-none"
                                />
                                <button onClick={() => { onRenameRoutine(r.id, renameValue); setRenamingRoutineId(null); }} className="p-1 text-green-400 flex-shrink-0">
                                  <Icon name="check" className="w-4 h-4" />
                                </button>
                                <button onClick={() => setRenamingRoutineId(null)} className="p-1 text-gray-400 flex-shrink-0">
                                  <Icon name="x" className="w-4 h-4" />
                                </button>
                              </div>
                            ) : (
                              <div className="flex items-center space-x-1.5">
                                <div className="font-bold text-sm text-gray-100 truncate">{r.name}</div>
                                <button
                                  onClick={() => { setRenamingRoutineId(r.id); setRenameValue(r.name); }}
                                  className="text-gray-500 hover:text-blue-400 flex-shrink-0"
                                >
                                  <Icon name="pencil" className="w-3.5 h-3.5" />
                                </button>
                              </div>
                            )}
                            <div className="text-xs text-gray-400 mt-0.5">{r.partSummary} • {r.exercises.length}개 운동</div>
                            <div className="text-[10px] text-gray-500 mt-0.5">{r.createdAt} 생성</div>
                          </div>
                          <button
                            onClick={() => onApplyRoutine(r)}
                            className="text-xs bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-lg active:scale-95 transition-transform flex-shrink-0"
                          >
                            적용
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 드래그 중 하단에 나타나는 삭제 드롭존 */}
          {draggingDate && (
            <div className="fixed inset-x-0 bottom-0 z-50 flex justify-center pb-6 pointer-events-none">
              <div
                data-delete-zone="true"
                className={`pointer-events-auto flex items-center space-x-2 px-6 py-3.5 rounded-full shadow-2xl border-2 transition-all ${
                  isOverDeleteZone
                    ? 'bg-red-600 border-red-300 scale-110'
                    : 'bg-red-900/80 border-red-700/60'
                }`}
              >
                <Icon name="trash-2" className="w-5 h-5 text-white" />
                <span className="text-sm font-bold text-white">여기로 끌어서 삭제</span>
              </div>
            </div>
          )}

          {/* 드래그 중 상단 안내 문구 */}
          {draggingDate && (
            <div className="fixed inset-x-0 top-3 z-50 flex justify-center pointer-events-none">
              <div className="bg-black/80 border border-gray-700 px-4 py-2 rounded-full text-xs text-gray-200 shadow-xl">
                {draggingDate} 을(를) 드래그 중 · 원하는 날짜에 놓으세요
              </div>
            </div>
          )}

          {/* 드롭 완료 → 이동/복사 선택 팝업 */}
          {dateActionState && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" onClick={() => setDateActionState(null)}>
              <div
                className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-xs p-4 space-y-3 shadow-2xl"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                  <h3 className="font-bold text-sm text-gray-100">
                    {dateActionState.fromDate} → {dateActionState.toDate}
                  </h3>
                  <button onClick={() => setDateActionState(null)} className="p-1 text-gray-400 hover:text-white">
                    <Icon name="x" />
                  </button>
                </div>
                <p className="text-xs text-gray-400">이 날짜의 운동 기록을 어떻게 처리할까요?</p>
                <button
                  onClick={() => {
                    onMoveDateLog(dateActionState.fromDate, dateActionState.toDate);
                    setDateActionState(null);
                  }}
                  className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-sm font-bold text-white rounded-xl flex items-center justify-center space-x-2"
                >
                  <Icon name="move" className="w-4 h-4" /> <span>이 날짜로 이동</span>
                </button>
                <button
                  onClick={() => {
                    onCopyDateLog(dateActionState.fromDate, dateActionState.toDate);
                    setDateActionState(null);
                  }}
                  className="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-sm font-semibold text-gray-100 rounded-xl flex items-center justify-center space-x-2"
                >
                  <Icon name="copy" className="w-4 h-4" /> <span>이 날짜로 복사</span>
                </button>
              </div>
            </div>
          )}

          {isMonthPickerOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-xs p-4 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                  <h3 className="font-bold text-base text-gray-100">연 / 월 선택</h3>
                  <button onClick={() => setIsMonthPickerOpen(false)} className="p-1 text-gray-400 hover:text-white">
                    <Icon name="x" />
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-3 text-center">
                  <div>
                    <label className="text-xs text-gray-400 block mb-1">연도</label>
                    <select 
                      value={currentYearMonth.year}
                      onChange={(e) => setCurrentYearMonth({ ...currentYearMonth, year: Number(e.target.value) })}
                      className="w-full bg-[#121212] border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none"
                    >
                      {[2024, 2025, 2026, 2027].map(y => (
                        <option key={y} value={y}>{y}년</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-xs text-gray-400 block mb-1">월</label>
                    <select 
                      value={currentYearMonth.month}
                      onChange={(e) => setCurrentYearMonth({ ...currentYearMonth, month: Number(e.target.value) })}
                      className="w-full bg-[#121212] border border-gray-700 rounded-lg p-2 text-sm text-white focus:outline-none"
                    >
                      {Array.from({ length: 12 }, (_, i) => i + 1).map(m => (
                        <option key={m} value={m}>{m}월</option>
                      ))}
                    </select>
                  </div>
                </div>

                <button 
                  onClick={() => setIsMonthPickerOpen(false)}
                  className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded-xl transition-colors"
                >
                  확인 및 적용
                </button>
              </div>
            </div>
          )}

          {isDataTransferModalOpen && (
            <DataTransferModal
              onClose={onCloseDataTransferModal}
              onExportData={onExportData}
              onImportData={onImportData}
            />
          )}
        </div>
      );
    }

    // ============================================================================
    // 데이터 내보내기/가져오기 (다른 앱/기기로 기록 이전용)
    // ============================================================================
    function DataTransferModal({ onClose, onExportData, onImportData }) {
      const [tab, setTab] = useState('export'); // 'export' | 'import'
      const [importText, setImportText] = useState('');
      const fileInputRef = useRef(null);

      const exportedJson = useMemo(() => (tab === 'export' ? onExportData() : ''), [tab, onExportData]);

      const handleCopy = async () => {
        try {
          await navigator.clipboard.writeText(exportedJson);
          await window.appAlert('클립보드에 복사되었습니다.\n새 앱에서 붙여넣기로 가져오세요.');
        } catch (e) {
          await window.appAlert('복사에 실패했습니다. 아래 내용을 직접 선택해서 복사해주세요.');
        }
      };

      const handleDownloadFile = () => {
        try {
          const blob = new Blob([exportedJson], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `workout-backup-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) {
          window.appAlert('파일 저장에 실패했습니다. "복사하기"로 대신 옮겨주세요.');
        }
      };

      const handleFileSelected = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => setImportText(String(ev.target.result || ''));
        reader.readAsText(file);
      };

      const handleImportClick = async () => {
        if (!importText.trim()) {
          await window.appAlert('가져올 데이터를 붙여넣거나 파일을 선택해주세요.');
          return;
        }
        if (!(await window.appConfirm('현재 기기의 운동기록/루틴을 가져온 데이터로 덮어씁니다.\n계속할까요?'))) return;
        const success = onImportData(importText);
        if (success) {
          await window.appAlert('가져오기가 완료되었습니다!');
          onClose();
        } else {
          await window.appAlert('가져오기에 실패했습니다. 올바른 백업 데이터인지 확인해주세요.');
        }
      };

      return (
        <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" onClick={onClose}>
          <div
            className="bg-[#1E1E1E] border border-gray-700 rounded-2xl w-full max-w-sm max-h-[85vh] flex flex-col shadow-2xl overflow-hidden"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="p-4 border-b border-gray-800 flex justify-between items-center bg-[#252525] flex-shrink-0">
              <h3 className="font-bold text-base text-gray-100">데이터 내보내기 / 가져오기</h3>
              <button onClick={onClose} className="p-1 text-gray-400 hover:text-white">
                <Icon name="x" />
              </button>
            </div>

            <div className="flex border-b border-gray-800 bg-[#1A1A1A] text-xs font-semibold flex-shrink-0">
              <button
                onClick={() => setTab('export')}
                className={`flex-1 py-2.5 ${tab === 'export' ? 'text-blue-400 border-b-2 border-blue-500 bg-[#222834]' : 'text-gray-400'}`}
              >
                내보내기
              </button>
              <button
                onClick={() => setTab('import')}
                className={`flex-1 py-2.5 ${tab === 'import' ? 'text-blue-400 border-b-2 border-blue-500 bg-[#222834]' : 'text-gray-400'}`}
              >
                가져오기
              </button>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {tab === 'export' ? (
                <>
                  <p className="text-xs text-gray-400 leading-relaxed">
                    이 기기의 운동기록·루틴·즐겨찾기를 다른 앱/기기로 옮기려면 아래 내용을 복사하거나 파일로 저장한 뒤,
                    새 앱의 '가져오기' 탭에 붙여넣거나 업로드하세요.
                  </p>
                  <textarea
                    readOnly
                    value={exportedJson}
                    onClick={(e) => e.target.select()}
                    className="w-full h-40 bg-[#121212] border border-gray-700 rounded-lg p-2 text-[10px] font-mono text-gray-300 resize-none focus:outline-none"
                  />
                  <div className="flex space-x-2">
                    <button
                      onClick={handleCopy}
                      className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="copy" className="w-3.5 h-3.5" />
                      <span>복사하기</span>
                    </button>
                    <button
                      onClick={handleDownloadFile}
                      className="flex-1 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-100 text-xs font-bold rounded-xl flex items-center justify-center space-x-1.5"
                    >
                      <Icon name="download" className="w-3.5 h-3.5" />
                      <span>파일로 저장</span>
                    </button>
                  </div>
                </>
              ) : (
                <>
                  <p className="text-xs text-gray-400 leading-relaxed">
                    이전 앱/기기에서 내보낸 데이터를 붙여넣거나 파일을 선택하면, 이 기기의 기존 기록을 덮어씁니다.
                  </p>
                  <button
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    className="w-full py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-100 text-xs font-bold rounded-xl flex items-center justify-center space-x-1.5"
                  >
                    <Icon name="upload" className="w-3.5 h-3.5" />
                    <span>파일 선택</span>
                  </button>
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept="application/json,.json"
                    onChange={handleFileSelected}
                    className="hidden"
                  />
                  <textarea
                    value={importText}
                    onChange={(e) => setImportText(e.target.value)}
                    placeholder="여기에 내보낸 데이터를 붙여넣으세요"
                    className="w-full h-40 bg-[#121212] border border-gray-700 rounded-lg p-2 text-[10px] font-mono text-gray-300 resize-none focus:outline-none focus:border-blue-500"
                  />
                  <button
                    onClick={handleImportClick}
                    className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold rounded-xl transition-colors"
                  >
                    가져오기 실행
                  </button>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 화면 2: Multi-Depth 운동 선택 시스템
    // ============================================================================
    function MultiDepthSelectView({ exerciseDb, onToggleFavorite, onCreateCustomExercise, routines, onSaveRoutine, onOverwriteRoutine, onDeleteRoutine, onRenameRoutine, stagedExercises, setStagedExercises, onBack, onComplete }) {
      return (
        <ExercisePickerBody
          exerciseDb={exerciseDb}
          onToggleFavorite={onToggleFavorite}
          onCreateCustomExercise={onCreateCustomExercise}
          routines={routines}
          onSaveRoutine={onSaveRoutine}
          onOverwriteRoutine={onOverwriteRoutine}
          onDeleteRoutine={onDeleteRoutine}
          onRenameRoutine={onRenameRoutine}
          stagedExercises={stagedExercises}
          setStagedExercises={setStagedExercises}
          onBack={onBack}
          onComplete={onComplete}
          completeLabel="선택 완료"
        />
      );
    }

    // ============================================================================
    // 운동 중 '운동추가' 모달 (동일 운동 선택 UI를 오버레이로 재사용)
    // ============================================================================
    function AddExerciseModal({ exerciseDb, onToggleFavorite, onCreateCustomExercise, routines, onSaveRoutine, onOverwriteRoutine, onDeleteRoutine, onRenameRoutine, existingIds, onClose, onComplete }) {
      const [localStaged, setLocalStaged] = useState([]);
      return (
        <div className="fixed inset-0 bg-[#121212] z-50 flex flex-col">
          <ExercisePickerBody
            exerciseDb={exerciseDb.filter(ex => !existingIds.includes(ex.id))}
            onToggleFavorite={onToggleFavorite}
            onCreateCustomExercise={onCreateCustomExercise}
            routines={routines}
            onSaveRoutine={onSaveRoutine}
            onOverwriteRoutine={onOverwriteRoutine}
            onDeleteRoutine={onDeleteRoutine}
            onRenameRoutine={onRenameRoutine}
            stagedExercises={localStaged}
            setStagedExercises={setLocalStaged}
            onBack={onClose}
            onComplete={() => onComplete(localStaged)}
            completeLabel="운동 추가"
          />
        </div>
      );
    }

    // ============================================================================
    // 운동 선택 화면 본체 (분류/전체/최근 30일/즐겨찾기/루틴/커스텀 탭 공통 컴포넌트)
    // ============================================================================
    function ExercisePickerBody({ exerciseDb, onToggleFavorite, onCreateCustomExercise, routines, onSaveRoutine, onOverwriteRoutine, onDeleteRoutine, onRenameRoutine, stagedExercises, setStagedExercises, onBack, onComplete, completeLabel }) {
      const [activeTab, setActiveTab] = useState('분류');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedPart, setSelectedPart] = useState(null);
      const [isCreateCustomModalOpen, setIsCreateCustomModalOpen] = useState(false);
      const [renamingRoutineId, setRenamingRoutineId] = useState(null);
      const [renameValue, setRenameValue] = useState('');

      const filteredExercises = useMemo(() => {
        return exerciseDb.filter(ex => {
          if (activeTab === '즐겨찾기' && !ex.isFavorite) return false;
          if (activeTab === '커스텀' && !ex.isCustom) return false;
          if (selectedPart && ex.partId !== selectedPart.id) return false;
          return isSearchMatch(ex.name, searchQuery) || isSearchMatch(ex.category, searchQuery);
        });
      }, [exerciseDb, activeTab, selectedPart, searchQuery]);

      const [isSaveRoutineModalOpen, setIsSaveRoutineModalOpen] = useState(false);

      const handleToggleStage = (exercise) => {
        const exists = stagedExercises.some(item => item.id === exercise.id);
        if (exists) {
          setStagedExercises(stagedExercises.filter(item => item.id !== exercise.id));
        } else {
          setStagedExercises([...stagedExercises, exercise]);
        }
      };

      const handleLoadRoutine = (routine) => {
        const toAdd = routine.exercises.filter(rEx => !stagedExercises.some(s => s.id === rEx.id));
        // DB의 표시정보(카테고리/기구/아이콘)는 최신 것을 쓰되, 루틴에 저장된 세트(무게/횟수/휴식)는 그대로 유지
        const merged = toAdd.map(rEx => {
          const dbEntry = exerciseDb.find(e => e.id === rEx.id);
          if (!dbEntry) return rEx;
          return {
            ...dbEntry,
            sets: rEx.sets,
            isBodyweight: rEx.isBodyweight !== undefined ? rEx.isBodyweight : dbEntry.isBodyweight
          };
        });
        setStagedExercises([...stagedExercises, ...merged]);
      };

      return (
        <div className="flex flex-col h-full bg-[#121212] relative overflow-hidden">
          <div className="p-3 bg-[#1E1E1E] border-b border-gray-800 flex items-center space-x-3 flex-shrink-0">
            <button onClick={onBack} className="p-1 text-gray-400 hover:text-white">
              <Icon name="chevron-left" className="w-6 h-6" />
            </button>
            <div className="flex-1 relative">
              <input 
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search(스쿼트, ㅅㅋㅌ ...)"
                className="w-full bg-[#121212] border border-gray-700/80 rounded-lg pl-3 pr-8 py-2 text-sm text-gray-100 focus:outline-none focus:border-blue-500"
              />
              {searchQuery && (
                <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-2.5 text-gray-500 hover:text-white">
                  <Icon name="x" className="w-4 h-4" />
                </button>
              )}
            </div>
            <button onClick={() => setIsCreateCustomModalOpen(true)} className="p-1 text-blue-400"><Icon name="plus" className="w-6 h-6" /></button>
          </div>

          <div className="flex border-b border-gray-800 bg-[#1A1A1A] text-xs font-semibold overflow-x-auto flex-shrink-0">
            {['분류', '전체', '최근 30일', '즐겨찾기', '루틴', '커스텀'].map((tab) => (
              <button
                key={tab}
                onClick={() => {
                  setActiveTab(tab);
                  setSelectedPart(null);
                }}
                className={`px-4 py-3 whitespace-nowrap transition-colors ${
                  activeTab === tab ? 'text-blue-400 border-b-2 border-blue-500 bg-[#222834]' : 'text-gray-400 hover:text-gray-200'
                }`}
              >
                {tab}
              </button>
            ))}
          </div>

          <div className="flex-1 overflow-y-auto p-3">
            {activeTab === '루틴' && (
              <div className="space-y-2">
                {routines.length === 0 ? (
                  <div className="text-center py-12 text-gray-500 text-xs">
                    저장된 루틴이 없습니다.<br/>운동을 선택한 뒤 아래 '루틴으로 저장' 버튼을 눌러보세요.
                  </div>
                ) : (
                  routines.map(r => (
                    <div key={r.id} className="bg-[#1E1E1E] border border-gray-800/80 rounded-xl p-3 flex items-center justify-between">
                      <div className="flex-1 min-w-0 mr-2">
                        {renamingRoutineId === r.id ? (
                          <div className="flex items-center space-x-1.5 mb-1">
                            <input
                              type="text"
                              autoFocus
                              value={renameValue}
                              onChange={(e) => setRenameValue(e.target.value)}
                              onKeyDown={(e) => {
                                if (e.key === 'Enter') { onRenameRoutine(r.id, renameValue); setRenamingRoutineId(null); }
                                if (e.key === 'Escape') setRenamingRoutineId(null);
                              }}
                              className="flex-1 min-w-0 bg-[#121212] border border-blue-500 rounded px-2 py-1 text-sm text-gray-100 focus:outline-none"
                            />
                            <button onClick={() => { onRenameRoutine(r.id, renameValue); setRenamingRoutineId(null); }} className="p-1 text-green-400 flex-shrink-0">
                              <Icon name="check" className="w-4 h-4" />
                            </button>
                            <button onClick={() => setRenamingRoutineId(null)} className="p-1 text-gray-400 flex-shrink-0">
                              <Icon name="x" className="w-4 h-4" />
                            </button>
                          </div>
                        ) : (
                          <div className="flex items-center space-x-1.5">
                            <div className="font-bold text-sm text-gray-100 truncate">{r.name}</div>
                            <button
                              onClick={() => { setRenamingRoutineId(r.id); setRenameValue(r.name); }}
                              className="text-gray-500 hover:text-blue-400 flex-shrink-0"
                            >
                              <Icon name="pencil" className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        )}
                        <div className="text-xs text-gray-400">{r.partSummary} • {r.exercises.length}개 운동</div>
                      </div>
                      <div className="flex items-center space-x-2 flex-shrink-0">
                        <button
                          onClick={() => handleLoadRoutine(r)}
                          className="text-xs bg-blue-600 hover:bg-blue-500 text-white font-bold px-2.5 py-1.5 rounded-lg"
                        >
                          불러오기
                        </button>
                        <button
                          onClick={async () => { if (await window.appConfirm(`'${r.name}' 루틴을 삭제할까요?`)) onDeleteRoutine(r.id); }}
                          className="p-1.5 text-gray-500 hover:text-red-400"
                        >
                          <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {activeTab !== '루틴' && activeTab === '분류' && !selectedPart && !searchQuery && (
              <div className="space-y-4">
                <div className="flex justify-between items-center text-xs text-gray-400 font-semibold px-1">
                  <span>부위 선택</span>
                  <span className="text-blue-400">전체 {exerciseDb.length}개 운동</span>
                </div>
                
                <div className="grid grid-cols-2 gap-2.5">
                  {BODY_PARTS.map((part) => (
                    <div
                      key={part.id}
                      onClick={() => setSelectedPart(part)}
                      className="bg-[#1E1E1E] hover:bg-[#252525] border border-gray-800 rounded-xl p-3 flex items-center justify-between cursor-pointer transition-all active:scale-98"
                    >
                      <div className="flex items-center space-x-3">
                        <span className="text-2xl">{part.icon}</span>
                        <span className="font-semibold text-sm">{part.name}</span>
                      </div>
                      <span className="text-xs font-mono text-blue-400">
                        {exerciseDb.filter(e => e.partId === part.id).length}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab !== '루틴' && (selectedPart || activeTab !== '분류' || searchQuery) && (
              <div className="space-y-2">
                {selectedPart && (
                  <div className="flex items-center space-x-2 text-xs text-blue-400 mb-3 bg-[#1E1E1E] p-2 rounded-lg">
                    <button onClick={() => setSelectedPart(null)} className="hover:underline flex items-center">
                      <Icon name="chevron-left" className="w-4 h-4 mr-1" /> 부위 목록으로
                    </button>
                    <span>/</span>
                    <span className="font-bold text-gray-200">{selectedPart.name}</span>
                  </div>
                )}

                {filteredExercises.length === 0 ? (
                  <div className="text-center py-12 text-gray-500 text-xs">
                    등록된 운동 목록이 없습니다.
                  </div>
                ) : (
                  filteredExercises.map((ex) => {
                    const isStaged = stagedExercises.some(item => item.id === ex.id);
                    return (
                      <div
                        key={ex.id}
                        onClick={() => handleToggleStage(ex)}
                        className={`p-4 rounded-xl border flex items-center justify-between cursor-pointer transition-all ${
                          isStaged 
                            ? 'bg-[#1E293B] border-blue-500/80 shadow-md' 
                            : 'bg-[#1E1E1E] border-gray-800/80 hover:bg-[#242424]'
                        }`}
                      >
                        <div className="flex items-center space-x-4">
                          <div className="w-16 h-16 rounded-xl bg-[#282828] flex items-center justify-center flex-shrink-0">
                            <ExerciseIcon category={ex.category} equipment={ex.equipment} name={ex.name} className="w-12 h-12 text-blue-300" />
                          </div>
                          <div>
                            <div className="font-bold text-sm text-gray-100">{ex.name}</div>
                            <div className="text-xs text-gray-400">{ex.category} • {ex.equipment}</div>
                          </div>
                        </div>

                        <div className="flex items-center space-x-2">
                          <button
                            onClick={(e) => { e.stopPropagation(); onToggleFavorite(ex.id); }}
                            className="p-1"
                            title="즐겨찾기"
                          >
                            <Icon name="star" className={`w-4 h-4 ${ex.isFavorite ? 'text-yellow-400' : 'text-gray-600'}`} {...(ex.isFavorite ? { fill: 'currentColor' } : {})} />
                          </button>
                          <span className={`text-xs px-2.5 py-1 rounded-lg ${isStaged ? 'bg-blue-600 text-white font-bold' : 'bg-gray-800 text-gray-400'}`}>
                            {isStaged ? '선택됨' : '추가'}
                          </span>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            )}
          </div>

          <div className="bg-[#1E1E1E] border-t border-gray-800 p-3 bottom-bar-safe space-y-3 flex-shrink-0">
            <div className="flex items-center justify-between text-xs px-1">
              <div className="flex items-center space-x-1.5 text-gray-300 font-bold">
                <Icon name="layers" className="w-4 h-4 text-blue-400" />
                <span>선택된 운동 ({stagedExercises.length})</span>
              </div>
              {stagedExercises.length > 0 && (
                <button onClick={() => setIsSaveRoutineModalOpen(true)} className="text-[11px] text-blue-400 font-semibold hover:underline flex items-center space-x-1">
                  <Icon name="bookmark-plus" className="w-3.5 h-3.5" />
                  <span>루틴으로 저장</span>
                </button>
              )}
            </div>

            <div className="flex space-x-2 overflow-x-auto pb-1">
              {stagedExercises.map((ex, index) => (
                <div 
                  key={ex.id}
                  className="min-w-[120px] bg-[#282828] border border-gray-700/60 rounded-lg p-2 relative flex flex-col justify-between"
                >
                  <button 
                    onClick={() => setStagedExercises(stagedExercises.filter(item => item.id !== ex.id))}
                    className="absolute top-1 right-1 p-1 text-gray-400 hover:text-white"
                  >
                    <Icon name="x" className="w-3.5 h-3.5" />
                  </button>
                  <span className="text-[10px] font-mono text-blue-400 font-bold">0{index + 1}</span>
                  <div className="text-xs font-semibold truncate my-1 text-gray-200">{ex.name}</div>
                  <div className="text-[9px] text-gray-400">{ex.equipment}</div>
                </div>
              ))}

              {stagedExercises.length === 0 && (
                <div className="w-full text-center py-2 text-xs text-gray-500 border border-dashed border-gray-700 rounded-lg">
                  운동을 선택하여 추가해 주세요
                </div>
              )}
            </div>

            <button
              onClick={onComplete}
              disabled={stagedExercises.length === 0}
              className="w-full py-3 bg-blue-600 hover:bg-blue-500 disabled:bg-gray-800 text-white text-sm font-bold rounded-xl transition-colors shadow-lg active:scale-98"
            >
              {completeLabel} ({stagedExercises.length}개 운동)
            </button>
          </div>

          {isSaveRoutineModalOpen && (
            <SaveRoutineModal
              routines={routines}
              exercises={stagedExercises}
              onClose={() => setIsSaveRoutineModalOpen(false)}
              onSaveNew={(name, exercises) => { onSaveRoutine(name, exercises); setIsSaveRoutineModalOpen(false); }}
              onOverwrite={(routineId, exercises) => { onOverwriteRoutine(routineId, exercises); setIsSaveRoutineModalOpen(false); }}
            />
          )}

          {isCreateCustomModalOpen && (
            <CreateCustomExerciseModal
              onClose={() => setIsCreateCustomModalOpen(false)}
              onCreate={(newExercise, addToStagedNow) => {
                onCreateCustomExercise(newExercise);
                if (addToStagedNow) {
                  setStagedExercises(prev => [...prev, newExercise]);
                }
                setIsCreateCustomModalOpen(false);
              }}
            />
          )}
        </div>
      );
    }

    // ============================================================================
    // 커스텀 운동 만들기 화면
    // ============================================================================
    const CUSTOM_EQUIPMENT_OPTIONS = ['없음', '덤벨', '바벨', '머신', '케이블', '밴드', '케틀벨', '맨몸', 'TRX'];
    const CUSTOM_TRACKING_OPTIONS = [
      '무게 x 횟수', '(체중 - 무게) x 횟수', '단계 x 횟수', '횟수', '시간', '무게 x 시간'
    ];
    // 맨몸/횟수 계열 운동 방식은 생성 시 자동으로 '맨몸 운동' 모드로 시작
    const BODYWEIGHT_TRACKING_TYPES = ['(체중 - 무게) x 횟수', '단계 x 횟수', '횟수'];

    // 옵션을 하단 시트로 선택하는 공용 컴포넌트
    function OptionSheet({ title, options, selected, onSelect, onClose }) {
      return (
        <div className="fixed inset-0 bg-black/70 flex items-end sm:items-center justify-center z-[70]" onClick={onClose}>
          <div
            className="bg-[#1E1E1E] border border-gray-700 rounded-t-2xl sm:rounded-2xl w-full sm:max-w-xs max-h-[75vh] flex flex-col shadow-2xl"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="p-4 border-b border-gray-800 flex-shrink-0">
              <h3 className="font-bold text-lg text-gray-100">{title}</h3>
            </div>
            <div className="flex-1 overflow-y-auto py-1">
              {options.map((opt) => (
                <button
                  key={opt}
                  onClick={() => onSelect(opt)}
                  className="w-full flex items-center space-x-3 px-4 py-3 hover:bg-[#282828] text-left"
                >
