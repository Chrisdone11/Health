    const getChosung = (str) => {
      let result = '';
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i) - 0xac00;
        if (code >= 0 && code <= 11172) {
          result += CHOSUNG_LIST[Math.floor(code / 588)];
        } else {
          result += str[i];
        }
      }
      return result;
    };

      const now = new Date();
      const y = now.getFullYear();

    const getPictogramKey = (category) => {
      const c = category || '';
      if (c.includes('벤치프레스') || c.includes('체스트프레스') || c.includes('클로즈그립')) return 'benchPress';
      if (c.includes('플라이')) return 'fly';
      if (c.includes('풀오버')) return 'pullover';
      if (c.includes('푸시업')) return 'pushup';
      if (c.includes('숄더프레스')) return 'shoulderPress';
      if (c.includes('스쿼트')) return 'squat';
      if (c.includes('풀업') || c.includes('친업')) return 'pullUp';
      if (c.includes('데드리프트')) return 'deadlift';
      if (c.includes('런지')) return 'lunge';
      if (c.includes('크런치') || c.includes('싯업') || c.includes('레그레이즈')) return 'crunch';
      if (c.includes('플랭크') || c.includes('코어안정화')) return 'plank';
      if (c.includes('로우')) return 'row';
      if (c.includes('리어델트')) return 'row';
      if (c.includes('랫풀다운')) return 'latPulldown';
      if (c.includes('레터럴레이즈') || c.includes('프론트레이즈')) return 'lateralRaise';
      if (c.includes('레그프레스') || c.includes('레그컬') || c.includes('레그익스텐션') || c.includes('어덕터') || c.includes('어브덕터')) return 'legMachine';
      if (c.includes('손목') || c.includes('그립')) return 'wristGrip';
      if (c.includes('컬')) return 'curl';
      if (c.includes('익스텐션') || c.includes('푸시다운') || c.includes('킥백')) return 'tricepsExtension';
      if (c.includes('카프레이즈')) return 'calfRaise';
      if (c.includes('슈러그')) return 'shrug';
      if (c.includes('힙쓰러스트') || c.includes('글루트브릿지')) return 'hip';
      if (c.includes('백익스텐션') || c.includes('회전운동')) return 'backExtension';
      if (c.includes('딥스')) return 'dips';
      if (c.includes('넥')) return 'neck';
      if (c.includes('줄넘기')) return 'jumpRope';
      return null;
    };

    // 복싱 라운드 종료 벨과 유사한 종소리 (더 길고 크게: 컴프레서로 볼륨 부스트 + 3연타)
    const playBoxingBellSound = () => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        // 컴프레서로 음량을 키워도 소리가 찢어지지 않게 처리
        const compressor = ctx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-24, ctx.currentTime);
        compressor.knee.setValueAtTime(30, ctx.currentTime);
        compressor.ratio.setValueAtTime(12, ctx.currentTime);
        compressor.attack.setValueAtTime(0.003, ctx.currentTime);
        compressor.release.setValueAtTime(0.25, ctx.currentTime);

        const masterGain = ctx.createGain();
        masterGain.gain.setValueAtTime(1.6, ctx.currentTime); // 전체 음량 부스트

        masterGain.connect(compressor);
        compressor.connect(ctx.destination);

        const ringBell = (startDelay) => {
          const startTime = ctx.currentTime + startDelay;
          // 벨 특유의 금속성 배음을 위해 여러 오실레이터를 겹침 (더 크고 길게)
          const partials = [
            { freq: 700, gain: 0.55, decay: 1.8 },
            { freq: 1050, gain: 0.40, decay: 1.5 },
            { freq: 1400, gain: 0.28, decay: 1.2 },
            { freq: 2100, gain: 0.18, decay: 0.9 },
            { freq: 2800, gain: 0.10, decay: 0.6 },
          ];
          partials.forEach(p => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(p.freq, startTime);
            gain.gain.setValueAtTime(0.0001, startTime);
            gain.gain.linearRampToValueAtTime(p.gain, startTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + p.decay);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start(startTime);
            osc.stop(startTime + p.decay + 0.05);
          });
        };

        // 복싱 라운드 종료처럼 세 번 연속 타종 (더 확실하게 들리도록)
        ringBell(0);
        ringBell(0.28);
        ringBell(0.56);
      } catch (e) {
        console.error('Audio play failed', e);
      }
    };

    // 카운트다운 진동 (초읽기용) - 패턴 배열 지정 가능, 이전 진동을 취소하고 새로 시작해 확실히 느껴지게 함

    const saveStorage = (key, value) => {

        localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
      } catch (e) {
        console.error('localStorage 저장 실패:', key, e);
        // 저장 실패는 곧 데이터 유실을 의미하므로, 세션당 한 번은 사용자에게 반드시 알림
        if (!_storageWarningShown && window.appAlert) {

        _dialogResolver = () => resolve(true);
        if (_setDialogState) _setDialogState({ type: 'alert', message });
      });
    };

    window.appConfirm = (message) => {
      return new Promise((resolve) => {
        _dialogResolver = (result) => resolve(result);
        if (_setDialogState) _setDialogState({ type: 'confirm', message });
      });
    };

    function AppDialogModal({ dialogState, onClose }) {

        _dialogResolver = null;
        onClose();

      return (

              >
                확인

            </div>

      }, [currentView, isReplaceModalOpen, isAddExerciseModalOpen, isRoutineModalOpen, isDataTransferModalOpen, exerciseInfoTarget, dateActionState]);

      // 화면 전환 시 히스토리 스택에 push (뒤로가기 대응)
      const navigatePush = () => {

      // 휴식 타이머 상태
      const [timerActive, setTimerActive] = useState(false);
      const [timerTotal, setTimerTotal] = useState(60);
      const [timerRemaining, setTimerRemaining] = useState(60);
      const [isMuted, setIsMuted] = useState(false);
      const timerEndTimeRef = useRef(null);
      const timerIntervalRef = useRef(null);
      const vibratedTicksRef = useRef(new Set());

      const startTimer = (seconds) => {
        setTimerTotal(seconds);
        setTimerRemaining(seconds);
        setTimerActive(true);
        vibratedTicksRef.current = new Set();
        
        const now = Date.now();
        timerEndTimeRef.current = now + seconds * 1000;

        if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);

        timerIntervalRef.current = setInterval(() => {
          const remainingMs = timerEndTimeRef.current - Date.now();
          const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));

          setTimerRemaining(remainingSec);

          // 종료 10초 전 + 3,2,1초 전 진동 (한 번씩만, 이중 펄스 패턴으로 확실히 인지되도록)
          if ([10, 3, 2, 1].includes(remainingSec) && !vibratedTicksRef.current.has(remainingSec)) {
            vibratedTicksRef.current.add(remainingSec);
            if (remainingSec === 10) {
              vibrateTick([350, 150, 350]); // 10초 전: 길게 두 번
            } else {
              vibrateTick([300, 120, 300]); // 3,2,1초 전: 강하고 짧게 두 번씩
            }
          }

          if (remainingSec <= 0) {
            clearInterval(timerIntervalRef.current);
            setTimerActive(false);
            vibrateTick([400, 150, 400, 150, 400]); // 종료: 강한 3연속 진동
            if (!isMuted) playBoxingBellSound();
          }
        }, 200);
      };

      const stopTimer = () => {
        if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
        setTimerActive(false);
      };

      const addTimerSeconds = (sec) => {
        if (!timerActive) return;
        timerEndTimeRef.current += sec * 1000;
        const remainingMs = timerEndTimeRef.current - Date.now();
        const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));
        setTimerRemaining(remainingSec);
        setTimerTotal(prev => Math.max(1, prev + sec));
      };

      const handleToggleSetComplete = (exIdx, setIdx) => {
        if (!activeSession) return;
        const targetExercise = activeSession.exercises[exIdx];
